<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #q {
        position: absolute; left: 88px; right: 88px; top: 50%;
        transform: translateY(-50%); z-index: 6;
        font-size: 94px; font-weight: 800; line-height: 1.06; letter-spacing: -0.025em;
      }
      #q .w { display: inline-block; }
      #q .hl { color: var(--violet); }
      #rule {
        position: absolute; left: 88px; top: 50%; width: 220px; height: 7px;
        border-radius: 4px; background: var(--violet); transform-origin: 0 50%;
        margin-top: -268px; z-index: 6;
      }
      #ghost {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        font-size: 400px; font-weight: 800; color: rgba(196,165,232,0.055);
        white-space: nowrap; z-index: 1;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s7-pregunta" data-width="1080" data-height="1350">
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>
      <div id="ghost" data-layout-allow-overflow>IA</div>
      <div id="rule"></div>
      <div id="q"></div>
      <div class="vignette"></div>
    </div>
    <script>
      // La pregunta es el call to action: entra palabra por palabra para que se lea sin sonido.
      const TEXT = "¿Y tú, ya eres parte del cambio?";
      const HL = ["parte", "del", "cambio?"];
      const q = document.getElementById("q");
      TEXT.split(" ").forEach((w, i) => {
        const s = document.createElement("span");
        s.className = "w" + (HL.includes(w) ? " hl" : "");
        s.textContent = w;
        q.appendChild(s);
        if (i < TEXT.split(" ").length - 1) q.appendChild(document.createTextNode(" "));
      });

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", { y: 40 }, { y: -10, duration: 4.2, ease: "none" }, 0);
      tl.fromTo("#ghost", { scale: 1.06, opacity: 0.5 },
        { scale: 1, opacity: 1, duration: 4.2, ease: "sine.inOut" }, 0);
      tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#q .w", { opacity: 0, y: 36, rotateX: -55 },
        { opacity: 1, y: 0, rotateX: 0, duration: 0.5, stagger: 0.075, ease: "power3.out" }, 0.3);
      tl.to("#q .hl", { textShadow: "0 0 42px rgba(123,63,242,0.85)", duration: 0.6,
        ease: "power2.out" }, 1.5);

      window.__timelines = window.__timelines || {};
      window.__timelines["s7-pregunta"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
