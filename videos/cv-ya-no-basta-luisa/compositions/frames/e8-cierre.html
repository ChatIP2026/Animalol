<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1350"/>
<script src="../../vendor/gsap.min.js"></script>
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#17122b}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden;
     background:radial-gradient(ellipse 70% 50% at 50% 47%,#2a1b55 0%,#17122b 70%)}
  .abs{position:absolute}
  #halo{left:190px;top:330px;width:700px;height:500px;border-radius:50%;opacity:0;
        background:radial-gradient(ellipse,rgba(123,63,242,.55),rgba(123,63,242,0) 65%);filter:blur(30px)}
  #logo{left:190px;top:470px;width:700px;opacity:0}
  #slogan{left:280px;top:720px;width:520px}
</style></head><body>
<div id="root" data-composition-id="e8-cierre" data-width="1080" data-height="1350">
  <div id="halo" class="abs"></div>
  <img id="logo" class="abs" src="../../elementos/logos/ipartner-color-crop.png">
  <img id="slogan" class="abs" src="../../elementos/logos/eslogan-blanco-crop.png">
</div>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.to("#halo", { opacity: 1, duration: 0.8 }, 0);
  tl.fromTo("#logo", { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power3.out" }, 0.1);
  // el slogan se revela de izquierda a derecha
  tl.fromTo("#slogan", { clipPath: "inset(0% 100% 0% 0%)", x: -12 }, { clipPath: "inset(0% 0% 0% 0%)", x: 0, duration: 0.7, ease: "power2.inOut" }, 0.7);
  tl.to("#halo", { scale: 1.06, duration: 1.0, repeat: 1, yoyo: true, ease: "sine.inOut" }, 0.9);
  tl.to({}, { duration: 0.01 }, 2.99);
  window.__timelines = window.__timelines || {};
  window.__timelines["e8-cierre"] = tl;
  tl.seek(0);
</script>
</body></html>
