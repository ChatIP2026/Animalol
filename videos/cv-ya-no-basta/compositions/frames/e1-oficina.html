<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #room { z-index: 6; position: absolute; left: 0; top: 300px; width: 1080px; }
      .tag {
        position: absolute; z-index: 12;
        font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--lavender);
        white-space: nowrap; opacity: 0;
      }
      .tag::after {
        content: ""; position: absolute; left: 50%; bottom: -16px;
        width: 2px; height: 12px; background: var(--lavender); opacity: 0.6;
      }
      #tagPost { left: 724px; top: 452px; transform: translateX(-50%); }
      #tagWork { left: 250px; top: 380px; transform: translateX(-50%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e1-oficina" data-width="1080" data-height="1350">
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>

      <svg id="room" viewBox="0 0 1080 760" fill="none">
        <!-- pared y piso: el lugar donde va a pasar TODO el video -->
        <path d="M0 622 H1080" stroke="#6d5f8c" stroke-width="5" opacity="0.65"/>
        <!-- puerta, por donde entra el postulante -->
        <g id="door" opacity="0.5">
          <rect x="864" y="214" width="166" height="408" rx="6"
            stroke="#6d5f8c" stroke-width="6" fill="rgba(109,95,140,0.10)"/>
          <circle cx="890" cy="430" r="8" fill="#6d5f8c"/>
        </g>

        <!-- el trabajador: sentado, de perfil, escribiendo -->
        <g id="worker">
          <path d="M150 452 V336 a16 16 0 0 1 16 -16 h18" stroke="#6d5f8c" stroke-width="13"
            stroke-linecap="round" fill="none"/>
          <path d="M162 452 V614" stroke="#6d5f8c" stroke-width="13" stroke-linecap="round"/>
          <path d="M214 450 H286 V604" stroke="#f6f4fa" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <g id="body">
            <path d="M206 452 L232 322" stroke="#f6f4fa" stroke-width="54" stroke-linecap="round"/>
            <circle cx="240" cy="276" r="42" fill="#f6f4fa"/>
            <path id="arm" d="M238 346 L352 404" stroke="#f6f4fa" stroke-width="26"
              stroke-linecap="round"/>
          </g>
        </g>

        <!-- escritorio -->
        <rect x="178" y="428" width="560" height="22" rx="8" fill="#b5a9cc"/>
        <rect x="196" y="450" width="18" height="172" rx="7" fill="#b5a9cc"/>
        <rect x="700" y="450" width="18" height="172" rx="7" fill="#b5a9cc"/>
        <!-- hoja sobre la que escribe -->
        <rect x="316" y="406" width="96" height="22" rx="4" fill="#e4d6f7" opacity="0.5"/>

        <!-- la pila que ya estaba ahí antes de que empezara el video -->
        <g id="stack"></g>

        <!-- el postulante: entra, deja, se va. Nada más. -->
        <g id="applicant" opacity="0">
          <path d="M-30 470 V604" stroke="#f6f4fa" stroke-width="24" stroke-linecap="round"/>
          <path d="M-30 356 V474" stroke="#f6f4fa" stroke-width="50" stroke-linecap="round"/>
          <circle cx="-30" cy="310" r="40" fill="#f6f4fa"/>
          <path id="appArm" d="M-30 390 L-96 420" stroke="#f6f4fa" stroke-width="24"
            stroke-linecap="round"/>
          <rect id="cvHand" x="-130" y="400" width="54" height="40" rx="4" fill="#7b3ff2"/>
        </g>
      </svg>

      <div class="tag" id="tagWork">reclutador</div>
      <div class="tag" id="tagPost">postulante</div>
      <div class="vignette"></div>
    </div>

    <script>
      // La pila inicial. Cada hoja es su propio elemento para que la nueva se sume encima.
      const stack = document.getElementById("stack");
      const SVGNS = "http://www.w3.org/2000/svg";
      function sheet(i, extra) {
        const r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", 548 + Math.cos(i * 1.9) * 7);
        r.setAttribute("y", 410 - i * 16);
        r.setAttribute("width", 136 + Math.sin(i * 2.4) * 10);
        r.setAttribute("height", 14);
        r.setAttribute("rx", 3);
        r.setAttribute("fill", i % 2 ? "#85207b" : "#7b3ff2");
        if (extra) r.id = extra;
        stack.appendChild(r);
        return r;
      }
      for (let i = 0; i < 7; i++) sheet(i);
      const newSheet = sheet(7, "newSheet"); // la que trae el postulante

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", { y: 0 }, { y: 26, duration: 3.2, ease: "none" }, 0);

      // 0.0 - 0.7 · el lugar y quién es. Ya está trabajando cuando empieza el video.
      gsap.set("#arm", { transformOrigin: "238px 346px" });
      gsap.set("#newSheet", { opacity: 0 });
      tl.fromTo("#tagWork", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.1);
      tl.to("#arm", { rotation: -5, duration: 0.3, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0);

      // 0.7 - 1.7 · entra el postulante (un bob vertical lee como caminata)
      tl.set("#applicant", { opacity: 1 });
      tl.fromTo("#applicant", { x: 1180 }, { x: 790, duration: 1.0, ease: "power2.out" }, 0.7);
      tl.to("#applicant", { y: -9, duration: 0.17, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0.7);
      tl.fromTo("#tagPost", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.95);

      // 1.7 - 2.2 · deja el CV sobre la pila. La pila crece.
      tl.to("#appArm", { attr: { d: "M-30 390 L-82 356" }, duration: 0.3, ease: "power2.out" }, 1.7);
      tl.to("#cvHand", { y: -54, x: -34, duration: 0.3, ease: "power2.out" }, 1.7);
      tl.to("#cvHand", { opacity: 0, duration: 0.01 }, 2.0);
      tl.fromTo("#newSheet", { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.in" }, 2.0);
      tl.fromTo("#stack", { y: 0 }, { y: -3, duration: 0.1, yoyo: true, repeat: 1 }, 2.3);

      // 2.2 - 3.2 · se va. Y detrás ya viene el siguiente.
      tl.to("#tagPost", { opacity: 0, duration: 0.25 }, 2.3);
      tl.to("#applicant", { x: 1180, duration: 0.85, ease: "power2.in" }, 2.35);
      tl.to("#applicant", { y: -9, duration: 0.17, repeat: 4, yoyo: true, ease: "sine.inOut" }, 2.35);
      tl.to("#door", { opacity: 1, duration: 0.3 }, 2.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["e1-oficina"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
