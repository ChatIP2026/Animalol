<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="../vendor/gsap.min.js"></script>
<style>
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#020a04}
  .abs{position:absolute}
  #vel{inset:0;background:radial-gradient(ellipse 55% 32% at 50% 50%,rgba(2,10,4,.9),rgba(2,10,4,0) 100%);opacity:0}
  #k{left:0;right:0;top:340px;text-align:center;font-family:"IBM Plex Mono",monospace;font-size:28px;letter-spacing:.5em;color:#3dff7a;opacity:0}
  #jw{left:660px;top:240px;width:600px;height:600px;opacity:0}
  #sub{left:960px;top:860px;max-width:1500px;width:max-content;padding:10px 28px;border-radius:6px;background:rgba(2,10,4,.82);text-align:center;font-family:"IBM Plex Mono",monospace;font-size:34px;line-height:1.4;color:#c8ffd8;text-shadow:0 0 12px rgba(43,255,106,.7),0 0 3px #000}
  #halo{inset:-90px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,255,106,.38),rgba(43,255,106,0) 72%)}
  #glitch{inset:0;background:#3dff7a;mix-blend-mode:screen;opacity:0}
</style></head><body>
<div id="root" data-composition-id="m0-apertura" data-width="1920" data-height="1080">
  <canvas id="lluvia" class="abs" width="1920" height="1080" style="left:0;top:0"></canvas>
  <div id="vel" class="abs"></div>
  <canvas id="titulo" class="abs" width="1920" height="1080" style="left:0;top:0"></canvas>
  <div id="jw" class="abs"><div id="halo" class="abs"></div><canvas id="jaina" class="abs" width="600" height="600" style="left:0;top:0"></canvas></div>
  <div id="sub" class="abs"></div>
  <div id="k" class="abs">ACCESO CONCEDIDO</div>
  <div id="glitch" class="abs"></div>
</div>
<script>
  let s0 = 7; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;
  const D = "0123456789";
  const G = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:.=*+<>";
  // --- lluvia de números (función pura del tiempo) ---
  const F = 22, COLS = 1920 / F | 0, ROWS = 1080 / F | 0;
  const col = [...Array(COLS)].map(() => ({ v: 7 + rnd() * 14, off: rnd() * 60, len: 10 + (rnd() * 26 | 0) }));
  const cx = document.getElementById("lluvia").getContext("2d");
  const dig = (a, b, t) => G[(a * 131 + b * 17 + Math.floor(t * 9 + a)) % G.length];
  function lluvia(t) {
    cx.fillStyle = "#020a04"; cx.fillRect(0, 0, 1920, 1080);
    cx.font = F + "px monospace";
    col.forEach((c, i) => {
      const head = Math.floor(c.off + t * c.v) % (ROWS + c.len + 10);
      for (let j = 0; j < c.len; j++) {
        const row = head - j; if (row < 0 || row > ROWS) continue;
        cx.fillStyle = j === 0 ? "rgba(220,255,230,.9)" : `rgba(43,255,106,${((1 - j / c.len) * .75).toFixed(2)})`;
        cx.fillText(dig(i, row, t), i * F, row * F);
      }
    });
  }
  // --- el título como una grilla de números: se muestrean los píxeles del texto ---
  const off = document.createElement("canvas"); off.width = 1920; off.height = 1080;
  const ox = off.getContext("2d");
  ox.fillStyle = "#fff"; ox.textAlign = "center"; ox.textBaseline = "middle";
  ox.font = "bold 132px monospace"; ox.fillText("HEMOS DESBLOQUEADO", 960, 480);
  ox.font = "bold 150px monospace"; ox.fillText("LA MATRIX", 960, 650);
  const px = ox.getImageData(0, 0, 1920, 1080).data, P = [], STEP = 11;
  for (let y = 0; y < 1080; y += STEP) for (let x = 0; x < 1920; x += STEP)
    if (px[(y * 1920 + x) * 4 + 3] > 128) {
      const r = rnd();
      // llegan de izquierda a derecha, cada número desde su propia altura
      P.push({ x, y, linea2: y > 565, t0: 18.2 + (x / 1920) * 3.5 + r * 0.8 + (y > 565 ? 1.2 : 0), caida: 250 + r * 700, k: (x * 7 + y * 3) % 10 });
    }
  const ct = document.getElementById("titulo").getContext("2d");
  const DUR_CAIDA = 1.0;
  function titulo(t, brillo) {
    ct.clearRect(0, 0, 1920, 1080);
    ct.font = "bold 13px monospace"; ct.textAlign = "center"; ct.textBaseline = "middle";
    P.forEach(p => {
      const u = (t - p.t0) / DUR_CAIDA; if (u < 0) return;
      const e = u >= 1 ? 1 : 1 - Math.pow(1 - u, 3);
      const y = p.y - p.caida * (1 - e);
      const fijo = u >= 1;
      ct.fillStyle = fijo ? (p.linea2 ? `rgba(61,255,122,${brillo})` : `rgba(220,255,230,${brillo})`) : "rgba(43,255,106,.8)";
      ct.fillText(fijo ? D[p.k] : D[(p.k + Math.floor(t * 20)) % 10], p.x, y);
    });
  }
  const st = { t: 0, b: 0.85 };
  // --- Jaina: esfera de partículas que se va formando, gira y respira ---
  let sj = 11; const rj = () => (sj = (sj * 16807) % 2147483647) / 2147483647;
  const cj = document.getElementById("jaina").getContext("2d"), PJ = [];
  for (let i = 0; i < 3200; i++) {
    const u = rj() * 2 - 1, a = rj() * 6.2832, r = Math.sqrt(1 - u * u);
    // más densidad hacia los polos, como la esfera de referencia
    const y = Math.sign(u) * Math.pow(Math.abs(u), 0.7), rr = Math.sqrt(1 - y * y);
    PJ.push({ x: Math.cos(a) * rr, y, z: Math.sin(a) * rr, b: 0.4 + rj() * 1.9, s: 1 + rj() * 1.4, k: 1.5 + rj() * 1.5 });
  }
  const forma = t => Math.min(1, Math.max(0, (t - 0.4) / 2.1));
  function jaina(t) {
    const br = Math.pow(0.5 + 0.5 * Math.sin(t * 1.35), 1.6), R = 230 * (1 + 0.04 * br + 0.05 * habla(t)), ry = t * 0.35, c = Math.cos(ry), sn = Math.sin(ry);
    cj.clearRect(0, 0, 600, 600);
    const f = forma(t);
    // fondo oscuro detrás de la esfera: la lluvia nunca se ve a través de Jaina
    const o = cj.createRadialGradient(300, 300, R * .9, 300, 300, R * 1.12);
    o.addColorStop(0, `rgba(2,10,4,${.96 * f})`); o.addColorStop(1, "rgba(2,10,4,0)");
    cj.fillStyle = o; cj.beginPath(); cj.arc(300, 300, R * 1.12, 0, 7); cj.fill();
    const g = cj.createRadialGradient(300, 300, 0, 300, 300, R * 1.1);
    g.addColorStop(0, `rgba(43,255,106,${(.10 + .08 * br) * f})`); g.addColorStop(1, "rgba(43,255,106,0)");
    cj.fillStyle = g; cj.beginPath(); cj.arc(300, 300, R * 1.1, 0, 7); cj.fill();
    PJ.forEach(p => {
      const e = Math.min(1, Math.max(0, (t - p.b) / 0.8)); if (e <= 0) return;
      const ee = 1 - Math.pow(1 - e, 3), sc = R * (1 + (p.k - 1) * (1 - ee));
      const X = p.x * c + p.z * sn, Z = -p.x * sn + p.z * c, d = (Z + 1) / 2;
      cj.fillStyle = `rgba(${(120 + 110 * d) | 0},255,${(150 + 80 * d) | 0},${((.25 + .75 * d) * ee).toFixed(2)})`;
      cj.fillRect(300 + X * sc, 300 + p.y * sc, p.s, p.s);
    });
    // letra J brillante, como el logo de Jaina
    const u = R / 300;
    cj.save(); cj.globalAlpha = Math.min(1, Math.max(0, (t - 2.0) / 0.5)); cj.translate(300, 300); cj.scale(u, u);
    cj.lineWidth = 13; cj.lineCap = "round"; cj.lineJoin = "round";
    cj.shadowColor = "#2bff6a"; cj.shadowBlur = 30 + 20 * br; cj.strokeStyle = "#f2fff5";
    cj.beginPath(); cj.moveTo(-22, -92); cj.lineTo(55, -92); cj.lineTo(55, 32); cj.arc(0, 32, 55, 0, Math.PI * .85); cj.stroke();
    cj.restore();
    document.getElementById("halo").style.opacity = (.4 + .6 * br) * f;
  }
  // --- guion de Jaina: [inicio, fin, texto]. Los tiempos se ajustarán al audio real ---
  const GUION = [
    [2.8, 10.0, "Hoy, muchos ven la inteligencia artificial como una Matrix: un sistema que decide por nosotros, que nos observa… y que nos controla."],
    [10.4, 12.6, "Pero nosotros vimos otra cosa. Vimos una puerta."],
    [12.9, 15.8, "Una forma de trabajar mejor, más rápido y con propósito."],
    [16.1, 17.2, "¿Lo bueno?"],
    [18.0, 21.6, "Es que en iPartner hemos desbloqueado la Matrix."],
  ];
  // mientras Jaina habla, la esfera vibra como una onda de voz
  function habla(t) {
    const g = GUION.find(([a, b]) => t >= a && t <= b); if (!g) return 0;
    return Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3 + 1));
  }
  const sub = document.getElementById("sub");
  gsap.set(sub, { xPercent: -50 });
  function subtitulo(t) {
    const g = GUION.find(([a, b]) => t >= a - 0.1 && t <= b + 0.6);
    if (!g) { sub.textContent = ""; sub.style.opacity = 0; return; }
    const n = Math.ceil(g[2].length * Math.min(1, (t - g[0]) / ((g[1] - g[0]) * 0.8)));
    sub.textContent = g[2].slice(0, Math.max(0, n));
    sub.style.opacity = t > g[1] ? Math.max(0, 1 - (t - g[1]) / 0.6) : 1;
  }
  function pintar() { lluvia(st.t); titulo(st.t, st.b); jaina(st.t); subtitulo(st.t); }
  const DUR = 40;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  tl.to("#vel", { opacity: 1, duration: 0.8 }, 0.6);
  // Jaina aparece al centro, se presenta y se desplaza a la esquina inferior derecha
  tl.set("#jw", { opacity: 1 }, 0.4);
  tl.to("#jw", { x: 790, y: 370, scale: 0.42, duration: 1.2, ease: "power3.inOut" }, 17.0);
  // cuando el título está armado, brilla
  tl.to(st, { b: 1, duration: 0.3, onUpdate: pintar }, 24.9);
  tl.to("#titulo", { filter: "drop-shadow(0 0 10px #2bff6a) drop-shadow(0 0 26px rgba(43,255,106,.6))", duration: 0.4 }, 24.9);
  [25.1, 25.2, 25.3, 25.45, 25.55].forEach((d, i) => tl.to("#k", { opacity: i % 2 ? 0.2 : 1, duration: 0.03 }, d));
  window.__timelines = window.__timelines || {};
  window.__timelines["m0-apertura"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: presentacion.html envía el tiempo; tras la entrada, la lluvia sigue en bucle con el título fijo
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    if (t < DUR) tl.seek(t); else { st.t = t; pintar(); }
  });
</script>
</body></html>
