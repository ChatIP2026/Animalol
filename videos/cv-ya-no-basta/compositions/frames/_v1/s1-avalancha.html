<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
      #hero { left: 447px; top: 551px; z-index: 5; }
      .swarm .cv { opacity: 0; }
      #counter {
        position: absolute; z-index: 10; left: 0; right: 0; bottom: 150px;
        text-align: center;
        font-family: "IBM Plex Mono", monospace;
        font-size: 40px; font-weight: 500; letter-spacing: 0.1em;
        color: var(--lavender); opacity: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="s1-avalancha"
      data-width="1080"
      data-height="1350"
    >
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>

      <div id="stage">
        <div class="swarm" id="swarm"></div>
        <div class="cv" id="hero">
          <i class="w90"></i><i class="w70"></i><i class="w90"></i><i class="w55"></i>
        </div>
      </div>

      <div id="counter">+1</div>
      <div class="vignette"></div>
    </div>

    <script>
      // Enjambre determinista: grilla regular con desfase por seno (sin Math.random).
      const swarm = document.getElementById("swarm");
      const COLS = 5, ROWS = 6, CW = 216, CH = 225;
      const cards = [];
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          if (r === 2 && c === 2) continue; // el hueco del hero
          const el = document.createElement("div");
          el.className = "cv";
          el.setAttribute("data-layout-allow-overflow", "");
          el.innerHTML = '<i class="w90"></i><i class="w70"></i><i class="w90"></i><i class="w55"></i>';
          const jx = Math.sin((r * COLS + c) * 1.7) * 14;
          const jy = Math.cos((r * COLS + c) * 2.3) * 12;
          el.style.left = 24 + c * CW + jx + "px";
          el.style.top = 110 + r * CH + jy + "px";
          swarm.appendChild(el);
          // distancia al centro: define el orden de aparición en cascada
          const d = Math.hypot(c - 2, r - 2);
          cards.push({ el, d });
        }
      }
      cards.sort((a, b) => a.d - b.d);
      const swarmEls = cards.map((c) => c.el);

      const tl = gsap.timeline({ paused: true });

      // deriva ambiental de la malla
      tl.fromTo("#mesh", { y: -30 }, { y: 30, duration: 3.2, ease: "none" }, 0);
      tl.fromTo(".glow-a", { scale: 0.92 }, { scale: 1.08, duration: 3.2, ease: "sine.inOut" }, 0);

      // TOMA 1 (0 - 1.6): un CV solo, enorme, respirando
      tl.fromTo(
        "#stage",
        { scale: 2.1 },
        { scale: 2.1, duration: 1.45, ease: "none" },
        0
      );
      tl.fromTo(
        "#hero",
        { opacity: 0, scale: 0.86, y: 26 },
        { opacity: 1, scale: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.05
      );

      // TOMA 2 (1.6 - 3.2): retroceso de cámara + la avalancha entra en cascada
      tl.to("#stage", { scale: 0.92, duration: 1.6, ease: "power2.inOut" }, 1.45);
      tl.fromTo(
        swarmEls,
        { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.42, ease: "back.out(1.9)", stagger: 0.028 },
        1.5
      );
      tl.fromTo("#counter", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.3 }, 1.7);

      const n = { v: 1 };
      const out = document.getElementById("counter");
      tl.to(
        n,
        {
          v: 418,
          duration: 1.4,
          ease: "power2.in",
          onUpdate: () => { out.textContent = "+" + Math.round(n.v); },
        },
        1.7
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["s1-avalancha"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
