<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1004"/>
<script src="vendor/gsap.min.js"></script>
<style>
  html,body{margin:0;background:#0d0a18;overflow:hidden}
  #root{position:relative;width:1920px;height:1004px;overflow:hidden;background:#000}
  .abs{position:absolute}
  #stage{left:0;top:0;width:1920px;height:1004px;transform:scale(1.2);transform-origin:0 0}
  #cam{left:0;top:0;width:1600px;height:837px}
  .scr{left:0;top:0;width:1600px;height:837px;overflow:hidden;background-size:1600px 837px}
  .crop{overflow:hidden}
  .crop>div{position:absolute;left:0;top:0;width:1600px;height:837px;background-size:1600px 837px}
  #cursor{left:0;top:0;width:34px;height:40px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
  .tap{left:0;top:0;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;opacity:0}
</style></head><body>
<div id="root" data-composition-id="main" data-start="0" data-duration="15.2" data-width="1920" data-height="1004">
  <div id="stage" class="abs"><div id="cam" class="abs">
    <div id="base" class="scr abs" style="background-image:url(assets/capturas/despues-cara1.png)">
      <div id="madera" class="abs" style="opacity:0"></div>
      <div id="pag" class="abs crop">
        <div id="g1" class="abs crop"><div style="background-image:url(assets/capturas/despues-cara1.png)"></div></div>
        <div id="g2" class="abs crop"><div style="background-image:url(assets/capturas/despues-cara2.png)"></div></div>
      </div>
    </div>
    <div id="al1" class="scr abs" style="opacity:0;background-image:url(assets/capturas/alerta-creditpro.png)"><div class="abs" style="left:1416px;top:730px;width:184px;height:107px;background:url(assets/capturas/alerta-onboarding.png) -1416px -730px/1600px 837px"></div></div>
    <div id="p1" class="abs crop" style="opacity:0"><div style="background-image:url(assets/capturas/alerta-creditpro.png)"></div></div>
    <div id="al2" class="scr abs" style="opacity:0;background-image:url(assets/capturas/alerta-onboarding.png)"></div>
    <div id="p2" class="abs crop" style="opacity:0"><div style="background-image:url(assets/capturas/alerta-onboarding.png)"></div></div>
    <div id="tap" class="tap abs"></div>
    <svg id="cursor" class="abs" viewBox="0 0 34 40"><path d="M3 2 L3 31 L10.5 24.5 L15.5 36 L21 33.5 L16 22.5 L26 22.5 Z" fill="#fff" stroke="#17122b" stroke-width="2.2" stroke-linejoin="round"/></svg>
  </div></div>
</div>
<script>
  // coordenadas medidas en las capturas de 2000 px de ancho; en pantalla el home mide 1600 px (×0.8)
  const K = 0.8;
  function recorte(sel, x, y, w, h) {
    const e = document.querySelector(sel);
    Object.assign(e.style, { left: x * K + "px", top: y * K + "px", width: w * K + "px", height: h * K + "px" });
    if (e.firstElementChild) Object.assign(e.firstElementChild.style, { left: -x * K + "px", top: -y * K + "px" });
  }
  // zona de productos (íconos + flechas), la única que cambia entre la cara 1 y la cara 2
  // las dos páginas de productos viven en una ventana recortada y se deslizan juntas, como las pantallas de un iPhone
  recorte("#pag", 990, 272, 780, 520);
  ["#g1", "#g2"].forEach(s => { recorte(s, 990, 272, 780, 520); Object.assign(document.querySelector(s).style, { left: 0, top: 0 }); });
  const W = 780 * K;
  gsap.set("#g2", { x: W });
  // madera limpia (sacada de la parte vacía de la cara 2) para tapar la zona mientras se desliza
  Object.assign(document.getElementById("madera").style, { left: 990 * K + "px", top: 272 * K + "px", width: 780 * K + "px", height: 520 * K + "px",
    background: "url(assets/capturas/despues-cara2.png) " + (-1140 * K * 1.26) + "px " + (-545 * K * 2.54) + "px/" + (1600 * 1.26) + "px " + (837 * 2.54) + "px", filter: "blur(2px)" });
  // ventanas de las alertas
  ["#p1", "#p2"].forEach(s => recorte(s, 796, 316, 408, 414));
  const P = (x, y) => ({ x: x * K, y: y * K });   // punto de la captura → coordenadas en pantalla
  const tl = gsap.timeline({ paused: true }), E = "power2.inOut", cam = "#cam", cur = "#cursor";
  // ritmo: todo el guion se escribe en "segundos de guion" y se comprime con S (más ágil y fluido)
  const S = 0.52;
  ["to", "set"].forEach(m => { const f = tl[m].bind(tl); tl[m] = (t, v, pos) => f(t, { ...v, ...(v.duration != null ? { duration: v.duration * S } : {}) }, pos * S); });
  { const f = tl.fromTo.bind(tl); tl.fromTo = (t, a, b, pos) => f(t, a, { ...b, ...(b.duration != null ? { duration: b.duration * S } : {}) }, pos * S); }
  // la cámara centra un punto (px, py) con escala s
  // nunca se ve el borde negro de la captura ni el fondo: el desplazamiento se limita según el zoom
  const B = 18, cl = (v, m) => Math.max(-m, Math.min(m, v));
  const enfoca = (px, py, s, extra = {}) => { s = Math.max(s, 1.03); return { x: cl((800 - px * K) * s, s * (800 - B) - 800), y: cl((418 - py * K) * s, s * (418 - B) - 418), scale: s, ...extra }; };
  function clic(x, y, t) {
    tl.set("#tap", P(x, y), t);
    tl.fromTo("#tap", { scale: .3, opacity: .9 }, { scale: 1.6, opacity: 0, duration: .5, ease: "power2.out", immediateRender: false }, t);
    tl.to(cur, { scale: .85, duration: .1, yoyo: true, repeat: 1 }, t);
  }
  const mueve = (x, y, t, d = 1.1) => tl.to(cur, { ...P(x, y), duration: d, ease: E }, t);

  // 0–3 s · el home completo, plano (el video va dentro de un pop up)
  tl.set(cam, { scale: 1.03, x: 0, y: 0 }, 0);
  tl.set(cur, { ...P(1250, 960), opacity: 1 }, 0);
  // 3–7 s · recorrido por los productos de la cara 1
  tl.to(cam, { ...enfoca(1380, 520, 1.18), duration: 2.4, ease: E }, 0.6);
  mueve(1062, 452, 1.0, 1.6); mueve(1376, 452, 4.4, 1.0); mueve(1532, 330, 5.5, .9);
  // 7–9 s · flecha → pasa a la cara 2 (deslizamiento horizontal, como en un iPhone)
  mueve(1724, 771, 6.5, 1.0); clic(1724, 771, 7.6);
  tl.fromTo("#g1", { x: 0 }, { x: -W, duration: 1.15, ease: "expo.inOut", immediateRender: false }, 7.7);
  tl.fromTo("#g2", { x: W }, { x: 0, duration: 1.15, ease: "expo.inOut", immediateRender: false }, 7.7);
  // 9–14 s · recorrido por la cara 2
  tl.to(cam, { ...enfoca(1300, 470, 1.3), duration: 2.6, ease: E }, 9.0);
  mueve(1062, 330, 9.3, 1.2); mueve(1376, 330, 10.7, 1.0); mueve(1218, 452, 11.9, 1.0); mueve(1532, 452, 13.0, .9);
  // 14–16 s · flecha ← vuelve a la cara 1
  tl.to(cam, { ...enfoca(1380, 520, 1.18), duration: 1.6, ease: E }, 13.8);
  mueve(1688, 771, 14.0, 1.0); clic(1688, 771, 15.1);
  tl.fromTo("#g2", { x: 0 }, { x: W, duration: 1.15, ease: "expo.inOut", immediateRender: false }, 15.2);
  tl.fromTo("#g1", { x: -W }, { x: 0, duration: 1.15, ease: "expo.inOut", immediateRender: false }, 15.2);
  // 17–21 s · Credit Pro → "Coming Soon 2027"
  mueve(1690, 452, 16.6, 1.0); clic(1690, 452, 17.7);
  tl.to(cam, { ...enfoca(1000, 523, 1.0), duration: 1.2, ease: E }, 17.8);
  tl.to("#al1", { opacity: 1, duration: .5 }, 17.9);
  tl.fromTo("#p1", { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: .55, ease: "back.out(1.6)", immediateRender: false }, 18.1);
  mueve(1000, 676, 19.0, 1.1); clic(1000, 676, 20.4);
  tl.to("#p1", { opacity: 0, scale: .9, duration: .35, ease: "power2.in" }, 20.5);
  tl.to("#al1", { opacity: 0, duration: .45 }, 20.6);
  // 21–26 s · Onboarding → "Coming Soon 2027"
  tl.to(cam, { ...enfoca(1380, 520, 1.18), duration: 1.4, ease: E }, 21.0);
  mueve(1376, 696, 21.2, 1.2); clic(1376, 696, 22.6);
  tl.to(cam, { ...enfoca(1000, 523, 1.0), duration: 1.2, ease: E }, 22.7);
  tl.to("#al2", { opacity: 1, duration: .5 }, 22.8);
  tl.fromTo("#p2", { opacity: 0, scale: .85 }, { opacity: 1, scale: 1, duration: .55, ease: "back.out(1.6)", immediateRender: false }, 23.0);
  mueve(1000, 676, 23.9, 1.1); clic(1000, 676, 25.3);
  tl.to("#p2", { opacity: 0, scale: .9, duration: .35, ease: "power2.in" }, 25.4);
  tl.to("#al2", { opacity: 0, duration: .45 }, 25.5);
  // 26–32 s · zoom out a la vista completa: el bucle empalma con el inicio
  tl.to(cam, { x: 0, y: 0, scale: 1.03, duration: 2, ease: E }, 26.2);
  mueve(1250, 960, 26.6, 1.6);
  window.__timelines = window.__timelines || {};
  window.__timelines["main"] = tl;
  tl.seek(0);
</script>
</body></html>
