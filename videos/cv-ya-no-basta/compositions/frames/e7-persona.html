<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1080, height=1350"/>
<script src="../../vendor/gsap.min.js"></script>
<style>
  html,body{margin:0;width:1080px;height:1350px;overflow:hidden;background:#17122b}
  #root{position:relative;width:1080px;height:1350px;overflow:hidden;
     background:radial-gradient(ellipse 70% 50% at 30% 30%,#2a1b55 0%,#17122b 70%)}
  .abs{position:absolute}
  #halo{left:470px;top:300px;width:520px;height:520px;border-radius:50%;opacity:0;
        background:radial-gradient(circle,rgba(123,63,242,.6),rgba(123,63,242,0) 65%);filter:blur(25px)}
</style></head><body>
<div id="root" data-composition-id="e7-persona" data-width="1080" data-height="1350">
 <div id="cam" class="abs" style="inset:0;transform-origin:540px 760px">
  <!-- la misma oficina de la escena 1, ahora sin la torre -->
  <div class="abs" style="left:0;right:0;top:1078px;height:4px;background:#3d3360"></div>
  <div class="abs" style="left:176px;top:700px;width:22px;height:200px;border-radius:11px;background:#4b4170"></div>
  <div class="abs" style="left:180px;top:880px;width:150px;height:20px;border-radius:8px;background:#4b4170"></div>
  <div class="abs" style="left:244px;top:900px;width:20px;height:178px;background:#4b4170"></div>
  <div class="abs" style="left:198px;top:1066px;width:112px;height:14px;border-radius:7px;background:#4b4170"></div>
  <!-- el reclutador, ahora erguido -->
  <img id="reclu" class="abs" src="../../elementos/personaje/reclutador-erguido-blanco.png" style="left:-115px;top:362px;width:827px">
  <div id="halo" class="abs"></div>
  <img id="app" class="abs" src="../../elementos/logos/ipartner-app.png" style="left:600px;top:450px;width:260px;opacity:0;border-radius:56px">
  <div class="abs" style="left:300px;top:812px;width:560px;height:24px;border-radius:6px;background:#c9bedd"></div>
  <div class="abs" style="left:322px;top:836px;width:516px;height:244px;background:#6f6294"></div>
  <div class="abs" style="left:318px;top:803px;width:150px;height:10px;border-radius:2px;background:#efe8fa"></div>
 </div>
</div>
<script>
  // voz (escena = 29.97 s): 1.6 "cambio que trae la inteligencia artificial"
  const CAMBIO = 1.6, FIN = 4.99;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#cam", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power2.out" }, 0);
  // respira tranquilo (antes estaba agobiado)
  tl.to("#reclu", { y: -4, duration: 1.2, repeat: 3, yoyo: true, ease: "sine.inOut" }, 0.5);
  // "cambio…": aparece iPartner sobre el escritorio
  tl.to("#halo", { opacity: 1, duration: 0.6 }, CAMBIO - 0.1);
  tl.fromTo("#app", { opacity: 0, scale: 0.4, y: 60 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.7)" }, CAMBIO);
  tl.to("#app", { y: -10, duration: 1.0, repeat: 2, yoyo: true, ease: "sine.inOut" }, CAMBIO + 0.6);
  tl.to({}, { duration: 0.01 }, FIN);
  window.__timelines = window.__timelines || {};
  window.__timelines["e7-persona"] = tl;
  tl.seek(0);
</script>
</body></html>
