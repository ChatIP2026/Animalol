<div class="bar abs" data-v="1225" data-t="2.0" style="left:232px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1225" data-t="2.0" style="left:212px;width:120px"></div><div class="mes abs" style="left:212px;width:120px;top:894px">ENE</div><div class="bar abs" data-v="1007" data-t="2.18" style="left:358px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1007" data-t="2.18" style="left:338px;width:120px"></div><div class="mes abs" style="left:338px;width:120px;top:894px">FEB</div><div class="bar abs" data-v="1243" data-t="2.36" style="left:482px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1243" data-t="2.36" style="left:462px;width:120px"></div><div class="mes abs" style="left:462px;width:120px;top:894px">MAR</div><div class="bar abs" data-v="1029" data-t="2.54" style="left:608px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1029" data-t="2.54" style="left:588px;width:120px"></div><div class="mes abs" style="left:588px;width:120px;top:894px">ABR</div><div class="bar abs" data-v="1012" data-t="2.7199999999999998" style="left:732px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1012" data-t="2.7199999999999998" style="left:712px;width:120px"></div><div class="mes abs" style="left:712px;width:120px;top:894px">MAY</div><div class="bar abs" data-v="1006" data-t="2.9" style="left:858px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1006" data-t="2.9" style="left:838px;width:120px"></div><div class="mes abs" style="left:838px;width:120px;top:894px">JUN</div><div class="bar abs" data-v="824" data-t="3.08" style="left:982px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="824" data-t="3.08" style="left:962px;width:120px"></div><div class="mes abs" style="left:962px;width:120px;top:894px">JUL</div><div class="bar abs" data-v="1234" data-t="3.26" style="left:1108px;width:80px;top:880px;height:0"></div><div class="val abs" data-v="1234" data-t="3.2 <script>
  let s0 = 7; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;
  const D = "0123456789";
  const G = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:.=*+<>";
  // --- lluvia de números (función pura del tiempo) ---
  const F = 22, COLS = 1920 / F | 0, ROWS = 1080 / F | 0;
  const col = [...Array(COLS)].map(() => ({ v: 7 + rnd() * 14, off: rnd() * 60, len: 10 + (rnd() * 26 | 0) }));
  const cx = document.getElementById("lluvia").getContext("2d");
  const dig = (a, b, t) => G[(a * 131 + b * 17 + Math.floor(t * 9 + a)) % G.length];
  function lluvia(t) {
    cx.fillStyle = "#020a04"; cx.fillRect(0, 0, 1920, 1080);
    cx.font = F + "px monospace";
    col.forEach((c, i) => {
      const head = Math.floor(c.off + t * c.v) % (ROWS + c.len + 10);
      for (let j = 0; j < c.len; j++) {
        const row = head - j; if (row < 0 || row > ROWS) continue;
        cx.fillStyle = j === 0 ? "rgba(220,255,230,.9)" : `rgba(43,255,106,${((1 - j / c.len) * .75).toFixed(2)})`;
        cx.fillText(dig(i, row, t), i * F, row * F);
      }
    });
  }
  // máquina de escribir: letra por letra a ritmo constante
  function maquina(el, g, t, cursorFijo) {
    if (t < g[0]) { el.textContent = ""; return; }
    const n = Math.min(g[2].length, Math.floor((t - g[0]) / ((g[1] - g[0]) * 0.8) * g[2].length));
    const cur = n < g[2].length || (cursorFijo && Math.floor(t * 2.5) % 2 === 0) ? "▌" : "";
    el.textContent = g[2].slice(0, n) + cur;
  }
  // textos: cada imagen con su subtítulo
  const TXT = [
    ["mod", [0.2, 1.2, "> MÓDULO_FINAL // FACTURACIÓN_2026"]],
    ["h", [0.4, 1.6, "TERMINEMOS DE CONQUISTAR LA MATRIX 2026"]],
    ["sub2", [1.6, 2.6, "Facturación 2026 … perspectivas de cierre de año"]],
  ];
  const st = { t: 0 };
  function pintar() {
    const t = st.t;
    lluvia(t); hud(t);
    TXT.forEach(([id, g]) => maquina(document.getElementById(id), g, t, false));
  }
  // --- HUD: anillos que giran, cifras que se descifran, pulsos por la red, engranaje ---
  const D10 = "0123456789";
  const fx = [...document.querySelectorAll(".fx")], cifras = [...document.querySelectorAll(".dig")], pul = [...document.querySelectorAll(".pul")];
  cifras.forEach(d => d.dataset.base = d.textContent);
  // --- Jaina: esfera de partículas que se va formando, gira y respira ---
  let sj = 11; const rj = () => (sj = (sj * 16807) % 2147483647) / 2147483647;
  const cj = document.getElementById("jaina").getContext("2d"), PJ = [];
  for (let i = 0; i < 3200; i++) {
    const u = rj() * 2 - 1, a = rj() * 6.2832, r = Math.sqrt(1 - u * u);
    // más densidad hacia los polos, como la esfera de referencia
    const y = Math.sign(u) * Math.pow(Math.abs(u), 0.7), rr = Math.sqrt(1 - y * y);
    PJ.push({ x: Math.cos(a) * rr, y, z: Math.sin(a) * rr, b: 0.4 + rj() * 1.9, s: 1 + rj() * 1.4, k: 1.5 + rj() * 1.5 });
  }
  const forma = () => 1;
  function jaina(t) {
    const br = Math.pow(0.5 + 0.5 * Math.sin(t * 1.35), 1.6), R = 230 * (1 + 0.04 * br + 0.05 * habla(t)), ry = t * 0.35, c = Math.cos(ry), sn = Math.sin(ry);
    cj.clearRect(0, 0, 600, 600);
    const f = forma(t);
    // fondo oscuro detrás de la esfera: la lluvia nunca se ve a través de Jaina
    const o = cj.createRadialGradient(300, 300, R * .9, 300, 300, R * 1.12);
    o.addColorStop(0, `rgba(2,10,4,${.96 * f})`); o.addColorStop(1, "rgba(2,10,4,0)");
    cj.fillStyle = o; cj.beginPath(); cj.arc(300, 300, R * 1.12, 0, 7); cj.fill();
    const g = cj.createRadialGradient(300, 300, 0, 300, 300, R * 1.1);
    g.addColorStop(0, `rgba(43,255,106,${(.10 + .08 * br) * f})`); g.addColorStop(1, "rgba(43,255,106,0)");
    cj.fillStyle = g; cj.beginPath(); cj.arc(300, 300, R * 1.1, 0, 7); cj.fill();
    PJ.forEach(p => {
      const e = 1;
      const ee = 1 - Math.pow(1 - e, 3), sc = R * (1 + (p.k - 1) * (1 - ee));
      const X = p.x * c + p.z * sn, Z = -p.x * sn + p.z * c, d = (Z + 1) / 2;
      cj.fillStyle = `rgba(${(120 + 110 * d) | 0},255,${(150 + 80 * d) | 0},${((.25 + .75 * d) * ee).toFixed(2)})`;
      cj.fillRect(300 + X * sc, 300 + p.y * sc, p.s, p.s);
    });
    // letra J brillante, como el logo de Jaina
    const u = R / 300;
    cj.save(); cj.globalAlpha = 1; cj.translate(300, 300); cj.scale(u, u);
    cj.lineWidth = 13; cj.lineCap = "round"; cj.lineJoin = "round";
    cj.shadowColor = "#2bff6a"; cj.shadowBlur = 30 + 20 * br; cj.strokeStyle = "#f2fff5";
    cj.beginPath(); cj.moveTo(-22, -92); cj.lineTo(55, -92); cj.lineTo(55, 32); cj.arc(0, 32, 55, 0, Math.PI * .85); cj.stroke();
    cj.restore();
    document.getElementById("halo").style.opacity = (.4 + .6 * br) * f;
  }
  const VOZ = [[1.0, 21.2], [23.0, 30.6]];
  function habla(t) { return VOZ.some(([a, b]) => t >= a && t <= b) ? Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3 + 1)) : 0; }
  gsap.set("#jw", { scale: 0.42 });
  const fmt = v => (v >= 1000 ? Math.floor(v / 1000) + "," + String(v % 1000).padStart(3, "0") : String(v)) + "K";
  const barras = [...document.querySelectorAll(".bar")], vals = [...document.querySelectorAll(".val")], proy = [...document.querySelectorAll(".proy")];
  // barras que crecen y cifras que cuentan hasta el dato real
  function hud(t) {
    barras.forEach((b, k) => {
      const p = Math.min(1, Math.max(0, (t - b.dataset.t) / 0.9)), e = 1 - Math.pow(1 - p, 3), h = b.dataset.v / 1300 * 430 * e;
      b.style.height = h + "px"; b.style.top = (880 - h) + "px";
      const v = vals[k]; v.textContent = p ? fmt(Math.round(b.dataset.v * e)) : ""; // la cifra nunca toca la línea del promedio (y=529): si chocaría, sube por encima de ella
      let y = 880 - h - 36; if (y < 535 && y + 30 > 523) y = 529 - 44; v.style.top = y + "px";
      if (b.dataset.curso !== undefined) { const c = document.getElementById("curso"); c.style.opacity = p >= 1 ? (Math.floor(t * 2) % 2 ? .4 : 1) : 0; c.style.left = (parseFloat(b.style.left) - 14) + "px"; c.style.top = Math.min(880 - h - 70, 529 - 36) + "px"; }
    });
    proy.forEach(e => e.style.opacity = t >= +e.dataset.t ? .5 + .5 * Math.abs(Math.sin(t * 2)) : 0);
    const pr = t >= 4.2 ? 1 : 0;
    document.getElementById("prom").style.opacity = pr; document.getElementById("promt").style.opacity = pr;
    jaina(t);
  }
  const DUR = 32;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  // cada imagen se "descarga": aparece el marco y una línea de escaneo la revela de arriba hacia abajo
  [["#c1", 1.2], ["#c2", 3.0]].forEach(([c, d]) => {
    tl.fromTo(c + " .marco", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, d);
    tl.fromTo(c + " .tapa", { scaleY: 1 }, { scaleY: 0, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.fromTo(c + " .scan", { y: 0, opacity: 1 }, { y: 516, opacity: 1, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.to(c + " .scan", { opacity: 0, duration: 0.2 }, d + 1.5);
    // el ícono se dibuja trazo por trazo
    tl.fromTo(c + " .tr", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, stagger: 0.12, ease: "power1.inOut", immediateRender: false }, d + 0.5);
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["m6-final"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: tras la entrada, la lluvia sigue en bucle
  // voz de Jaina en modo presentación: arranca sincronizada con el reloj de la slide
  const VOCES = [["../assets/voz/04-cierre.mp3", 1.0], ["../assets/voz/05-foto.mp3", 23.0]].map(([src, at]) => ({ a: new Audio(src), at, ok: false }));
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    VOCES.forEach(v => { if (!v.ok && t >= v.at) { v.ok = true; v.a.currentTime = Math.max(0, t - v.at); v.a.play().catch(() => {}); } });
    // seek no dispara onUpdate (suppressEvents), así que se repinta a mano
    if (t < DUR) tl.seek(t); else st.t = t;
    pintar();
  });
</script>
