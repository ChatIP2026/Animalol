<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<link rel="preload" href="../vendor/maquina.ttf" as="font" type="font/ttf" crossorigin/>
<script src="../vendor/gsap.min.js"></script>
<style>
  html,body{margin:0;overflow:hidden;background:#020a04}
  @font-face{font-family:"Maquina";src:url("../vendor/maquina.ttf")}
  @font-face{font-family:"Tiza";src:url("../vendor/tiza.ttf")}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#020a04}
  .abs{position:absolute}
  #vel{inset:0;background:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(2,10,4,.92),rgba(2,10,4,0) 100%);opacity:0}
  #mod{left:80px;top:64px;font-family:"Maquina",monospace;font-size:30px;letter-spacing:.12em;color:#3dff7a;text-shadow:0 0 10px rgba(43,255,106,.6)}
  #sub{left:200px;right:200px;top:860px;text-align:center;font-family:"Maquina",monospace;font-size:36px;line-height:1.4;color:#c8ffd8;text-shadow:0 0 4px #000,0 0 10px #000,0 0 18px #000,0 0 12px rgba(43,255,106,.6)}
  #q1,#q2{left:0;right:0;text-align:center;font-family:"Maquina",monospace;color:#e6ffee;text-shadow:0 0 18px rgba(43,255,106,.8),0 0 4px #000}
  #q1{top:380px;font-size:84px;color:#3dff7a}
  #q2{top:500px;font-size:62px;line-height:1.35;padding:0 160px}
  #jw{left:1450px;top:610px;width:600px;height:600px}
  #halo{inset:-90px;border-radius:50%;background:radial-gradient(closest-side,rgba(43,255,106,.38),rgba(43,255,106,0) 72%)}
</style></head><body>
<div id="root" data-composition-id="m1-business" data-width="1920" data-height="1080">
  <canvas id="mate" class="abs" width="1920" height="1080" style="left:0;top:0"></canvas>
  <div id="vel" class="abs"></div>
  <div id="mod" class="abs"></div>
  <div id="q1" class="abs"></div>
  <div id="q2" class="abs"></div>
  <div id="sub" class="abs"></div>
  <div id="jw" class="abs"><div id="halo" class="abs"></div><canvas id="jaina" class="abs" width="600" height="600" style="left:0;top:0"></canvas></div>
</div>
<script>
  // --- fondo: fórmulas matemáticas flotando, como un algoritmo complejo (función pura del tiempo) ---
  let s0 = 5; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;
  const FORM = ["E = mc²", "x² + 2ax + a² = (x + a)²", "Sₙ = n/2 [2a + (n − 1)d]", "cos(−x) = cos(x)", "π = 3,14", "y = 1 / (1 + x)",
    "∫ f(x) dx", "Σ xᵢ / n", "√(a² + b²)", "φ", "3x = 2", "z = y + 3", "lim x→∞", "(ab)ᵐ = aᵐbᵐ", "a² + 2ab + b²", "∂f/∂x",
    "ROI = (G − I) / I", "f(x) = ax² + bx + c", "Δ = b² − 4ac", "log₂ n", "P(A|B)", "∞", "x = −b ± √Δ / 2a", "eⁱᵖ + 1 = 0", "α + β = 90°", "n!"];
  const M = [];
  for (let i = 0; i < 46; i++) {
    const z = rnd();  // 0 = lejos, 1 = cerca
    M.push({ f: FORM[i % FORM.length], x: rnd() * 1920, y: rnd() * 1080, z, vx: (rnd() - .5) * 30, vy: -8 - rnd() * 14, b: rnd() * 1.2 });
  }
  M.sort((a, b) => a.z - b.z);
  const cm = document.getElementById("mate").getContext("2d");
  function mate(t, foco) {
    cm.fillStyle = "#020a04"; cm.fillRect(0, 0, 1920, 1080);
    cm.textAlign = "center"; cm.textBaseline = "middle";
    M.forEach(m => {
      const a = Math.min(1, Math.max(0, (t - m.b) / 1.2)); if (!a) return;
      const size = 26 + m.z * m.z * 130, x = ((m.x + m.vx * t) % 2300 + 2300) % 2300 - 190, y = ((m.y + m.vy * t * (0.4 + m.z)) % 1300 + 1300) % 1300 - 110;
      // las lejanas y las muy cercanas van desenfocadas, como en la referencia
      const blur = m.z < .35 ? (.35 - m.z) * 10 : m.z > .8 ? (m.z - .8) * 30 : 0;
      cm.filter = blur ? `blur(${blur.toFixed(1)}px)` : "none";
      cm.font = `${size | 0}px "Tiza", serif`;
      cm.fillStyle = `rgba(215,255,225,${(a * (.18 + .6 * (1 - Math.abs(m.z - .6))) * foco).toFixed(3)})`;
      cm.fillText(m.f, x, y);
    });
    cm.filter = "none";
  }
  // --- Jaina: esfera de partículas que se va formando, gira y respira ---
  let sj = 11; const rj = () => (sj = (sj * 16807) % 2147483647) / 2147483647;
  const cj = document.getElementById("jaina").getContext("2d"), PJ = [];
  for (let i = 0; i < 3200; i++) {
    const u = rj() * 2 - 1, a = rj() * 6.2832, r = Math.sqrt(1 - u * u);
    // más densidad hacia los polos, como la esfera de referencia
    const y = Math.sign(u) * Math.pow(Math.abs(u), 0.7), rr = Math.sqrt(1 - y * y);
    PJ.push({ x: Math.cos(a) * rr, y, z: Math.sin(a) * rr, b: 0.4 + rj() * 1.9, s: 1 + rj() * 1.4, k: 1.5 + rj() * 1.5 });
  }
  const forma = () => 1;
  function jaina(t) {
    const br = Math.pow(0.5 + 0.5 * Math.sin(t * 1.35), 1.6), R = 230 * (1 + 0.04 * br + 0.05 * habla(t)), ry = t * 0.35, c = Math.cos(ry), sn = Math.sin(ry);
    cj.clearRect(0, 0, 600, 600);
    const f = forma(t);
    // fondo oscuro detrás de la esfera: la lluvia nunca se ve a través de Jaina
    const o = cj.createRadialGradient(300, 300, R * .9, 300, 300, R * 1.12);
    o.addColorStop(0, `rgba(2,10,4,${.96 * f})`); o.addColorStop(1, "rgba(2,10,4,0)");
    cj.fillStyle = o; cj.beginPath(); cj.arc(300, 300, R * 1.12, 0, 7); cj.fill();
    const g = cj.createRadialGradient(300, 300, 0, 300, 300, R * 1.1);
    g.addColorStop(0, `rgba(43,255,106,${(.10 + .08 * br) * f})`); g.addColorStop(1, "rgba(43,255,106,0)");
    cj.fillStyle = g; cj.beginPath(); cj.arc(300, 300, R * 1.1, 0, 7); cj.fill();
    PJ.forEach(p => {
      const e = 1;
      const ee = 1 - Math.pow(1 - e, 3), sc = R * (1 + (p.k - 1) * (1 - ee));
      const X = p.x * c + p.z * sn, Z = -p.x * sn + p.z * c, d = (Z + 1) / 2;
      cj.fillStyle = `rgba(${(120 + 110 * d) | 0},255,${(150 + 80 * d) | 0},${((.25 + .75 * d) * ee).toFixed(2)})`;
      cj.fillRect(300 + X * sc, 300 + p.y * sc, p.s, p.s);
    });
    // letra J brillante, como el logo de Jaina
    const u = R / 300;
    cj.save(); cj.globalAlpha = 1; cj.translate(300, 300); cj.scale(u, u);
    cj.lineWidth = 13; cj.lineCap = "round"; cj.lineJoin = "round";
    cj.shadowColor = "#2bff6a"; cj.shadowBlur = 30 + 20 * br; cj.strokeStyle = "#f2fff5";
    cj.beginPath(); cj.moveTo(-22, -92); cj.lineTo(55, -92); cj.lineTo(55, 32); cj.arc(0, 32, 55, 0, Math.PI * .85); cj.stroke();
    cj.restore();
    document.getElementById("halo").style.opacity = (.4 + .6 * br) * f;
  }
  // --- guion de Jaina: [inicio, fin, texto]. Los tiempos se ajustarán al audio real ---

  // --- guion de Jaina (tiempos provisionales, se ajustarán al audio) ---
  const GUION = [];
  const Q1 = [0.5, 1.2, "Mario:"], Q2 = [1.6, 4.2, "¿cómo pudieron desbloquear la Business Matrix?"], MOD = [0.2, 1.4, "> MÓDULO_01 // BUSINESS_MATRIX"];
  const VOZ = GUION.concat([Q1, Q2]);
  function habla(t) {
    if (!VOZ.some(([a, b]) => t >= a && t <= b)) return 0;
    return Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3 + 1));
  }
  // máquina de escribir: letra por letra a ritmo constante, con cursor que parpadea
  function maquina(el, g, t, fijo) {
    if (!g || t < g[0] - 0.35) { el.textContent = ""; return; }
    // el texto se adelanta un poco a la voz y se escribe a su ritmo
    const n = Math.min(g[2].length, Math.floor((t - g[0] + 0.35) / ((g[1] - g[0]) * 0.8) * g[2].length));
    const cursor = n < g[2].length || (fijo && Math.floor(t * 2.5) % 2 === 0) ? "▌" : " ";
    el.textContent = g[2].slice(0, Math.max(0, n)) + (fijo || n < g[2].length ? cursor : "");
  }
  const sub = document.getElementById("sub");
  gsap.set("#jw", { scale: 0.42 });
  const st = { t: 0, foco: 1 };
  function pintar() {
    const t = st.t;
    mate(t, st.foco); jaina(t);
    const g = GUION.find(([a, b]) => t >= a - 0.35 && t <= b + 0.5);
    maquina(sub, g, t, true); sub.style.opacity = g ? 1 : 0;
    maquina(document.getElementById("mod"), MOD, t, false);
    maquina(document.getElementById("q1"), Q1, t, false);
    maquina(document.getElementById("q2"), Q2, t, t > Q2[0]);
  }
  const DUR = 12;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  // con la pregunta, las fórmulas bajan para que el texto mande
  tl.to(st, { foco: 0.45, duration: 1.2, onUpdate: pintar }, 0.4);
  tl.to("#vel", { opacity: 1, duration: 1.2 }, 0.4);
  window.__timelines = window.__timelines || {};
  window.__timelines["m1-business"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: presentacion.html envía el tiempo; al terminar, el fondo sigue en bucle
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    // Siempre se lleva la línea de tiempo hasta donde toca (o a su final si ya pasó): si el reloj da un salto
    // (pestaña en segundo plano, equipo lento) nada queda a medio aparecer. seek no repinta solo, así que se repinta a mano.
    tl.seek(Math.min(t, DUR)); st.t = t;
    pintar();
  });
</script>
</body></html>
