<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fondo Matrix</title>
<style>
  html,body{margin:0;height:100%;background:#020a04;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh}
</style></head><body>
<canvas id="c"></canvas>
<script>
  // lluvia de código de la presentación Matrix 2026, a pantalla completa y en bucle infinito
  const G = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:.=*+<>";
  const F = 22, cv = document.getElementById("c"), cx = cv.getContext("2d");
  let cols = [];
  function medir() {
    cv.width = innerWidth; cv.height = innerHeight;
    cols = [...Array(Math.ceil(innerWidth / F))].map(() => ({ y: Math.random() * -50, v: .25 + Math.random() * .55, len: 10 + Math.random() * 25 | 0 }));
  }
  addEventListener("resize", medir); medir();
  (function cuadro(now) {
    cx.fillStyle = "#020a04"; cx.fillRect(0, 0, cv.width, cv.height); cx.font = F + "px monospace";
    cols.forEach((c, k) => {
      c.y += c.v; if ((c.y - c.len) * F > cv.height) c.y = Math.random() * -20;
      for (let j = 0; j < c.len; j++) {
        const row = Math.floor(c.y) - j; if (row < 0) continue;
        cx.fillStyle = j === 0 ? "rgba(220,255,230,.95)" : `rgba(43,255,106,${((1 - j / c.len) * .75).toFixed(2)})`;
        cx.fillText(G[(k * 31 + row * 7 + (now / 120 | 0)) % G.length], k * F, row * F);
      }
    });
    requestAnimationFrame(cuadro);
  })(performance.now());
</script>
</body></html>
