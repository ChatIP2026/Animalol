<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=1920, height=1080"/>
<script src="../vendor/gsap.min.js"></script>
<style>
  @font-face{font-family:"Maquina";src:url("../vendor/maquina.ttf")}
  #root{position:relative;width:1920px;height:1080px;overflow:hidden;background:#020a04}
  .abs{position:absolute}
  #vel{inset:0;background:rgba(2,10,4,.72)}
  #mod{left:80px;top:110px;font-family:"Maquina",monospace;font-size:26px;letter-spacing:.12em;color:#3dff7a;opacity:.8}
  #h{left:0;right:0;top:150px;text-align:center;font-family:"Maquina",monospace;font-size:78px;letter-spacing:.06em;color:#3dff7a;text-shadow:0 0 18px rgba(43,255,106,.8),0 0 4px #000}
  .card{top:300px;width:780px}
  #c1{left:140px} #c2{left:1000px}
  .marco{position:relative;height:520px;border:2px solid rgba(61,255,122,.55);background:rgba(2,16,6,.9);box-shadow:0 0 30px rgba(43,255,106,.18) inset,0 0 24px rgba(43,255,106,.25);opacity:0}
  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Maquina",monospace;font-size:28px;color:rgba(61,255,122,.5);text-align:center}
  .ph small{font-size:18px;opacity:.7;margin-top:8px}
  .img{position:absolute;inset:10px;background-size:contain;background-position:center;background-repeat:no-repeat}
  .ico{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 0 8px rgba(43,255,106,.6))}
  .tr{stroke-dasharray:1;stroke-dashoffset:1}
  .tapa{inset:0;background:#020a04;transform-origin:50% 100%}
  .scan{left:0;right:0;top:0;height:4px;background:#b9ffd0;box-shadow:0 0 18px 6px rgba(43,255,106,.7);opacity:0}
  .esq{position:absolute;width:34px;height:34px;border:4px solid #3dff7a}
  .esq.a{left:-8px;top:-8px;border-right:0;border-bottom:0} .esq.b{right:-8px;top:-8px;border-left:0;border-bottom:0}
  .esq.c{left:-8px;bottom:-8px;border-right:0;border-top:0} .esq.d{right:-8px;bottom:-8px;border-left:0;border-top:0}
  .tit{margin-top:30px;text-align:center;font-family:"Maquina",monospace;font-size:46px;color:#e6ffee;text-shadow:0 0 14px rgba(43,255,106,.8);min-height:56px}
  .sub{margin-top:8px;text-align:center;font-family:"Maquina",monospace;font-size:28px;color:#9fe8b4;min-height:36px}
</style></head><body>
<div id="root" data-composition-id="m1-ppt" data-width="1920" data-height="1080">
  <canvas id="lluvia" class="abs" width="1920" height="1080" style="left:0;top:0"></canvas>
  <div id="vel" class="abs"></div>
  <div id="mod" class="abs"></div>
  <div id="h" class="abs"></div>
  <div id="c1" class="abs card">
    <div class="marco"><svg class="ico" viewBox="0 0 760 440">
      <g id="anA" opacity=".55"><circle cx="240" cy="220" r="185" stroke="#3dff7a" stroke-width="2" fill="none" stroke-dasharray="4 14"/></g>
      <g id="anB" opacity=".4"><circle cx="240" cy="220" r="165" stroke="#3dff7a" stroke-width="6" fill="none" stroke-dasharray="60 20 8 20"/></g>
      <rect stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" x="120" y="60" width="240" height="320" rx="10"/>
      <rect x="120" y="60" width="240" height="44" fill="rgba(61,255,122,.22)" class="fx" data-t="1.9"/>
      <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="18" x="240" y="89" text-anchor="middle" class="fx" data-t="1.9">COTIZACIÓN</text>
      <path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M150 150 H330"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="150" y="142" class="fx" data-t="2.0">ÍTEM 01</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="330" y="142" text-anchor="end" class="dig" data-t="2.0">S/ 0000</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M150 188 H330"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="150" y="180" class="fx" data-t="2.25">ÍTEM 02</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="330" y="180" text-anchor="end" class="dig" data-t="2.25">S/ 0000</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M150 226 H330"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="150" y="218" class="fx" data-t="2.5">ÍTEM 03</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="330" y="218" text-anchor="end" class="dig" data-t="2.5">S/ 0000</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M150 264 H330"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="150" y="256" class="fx" data-t="2.75">ÍTEM 04</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="330" y="256" text-anchor="end" class="dig" data-t="2.75">S/ 0000</text>
      <path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" d="M150 320 H330"/>
      <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="20" x="150" y="352" class="fx" data-t="3.1">TOTAL</text>
      <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="20" x="330" y="352" text-anchor="end" class="dig" data-t="3.1">S/ 00,000</text>
      <g class="fx" data-t="2.2">
        <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="20" x="450" y="120">VALIDANDO…</text>
        <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="22" x="450" y="175" class="fx" data-t="2.6">✓ PRECIO</text>
        <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="22" x="450" y="220" class="fx" data-t="2.9">✓ ALCANCE</text>
        <text font-family="Maquina, monospace" fill="#c8ffd8" font-size="22" x="450" y="265" class="fx" data-t="3.2">✓ PLAZO</text>
      </g>
      <g transform="translate(555 350) rotate(-12)"><g id="sello" opacity="0">
        <rect x="-115" y="-34" width="230" height="68" rx="8" stroke="#3dff7a" stroke-width="5" fill="rgba(61,255,122,.12)"/>
        <text font-family="Maquina, monospace" font-size="34" fill="#3dff7a" text-anchor="middle" y="12">APROBADO</text>
      </g></g>
    </svg><div class="tapa abs"></div><div class="scan abs"></div>
      <i class="esq a"></i><i class="esq b"></i><i class="esq c"></i><i class="esq d"></i></div>
    <div class="tit" id="t1"></div>
  </div>
  <div id="c2" class="abs card">
    <div class="marco"><svg class="ico" viewBox="0 0 760 440">
      <g id="anC" opacity=".45"><circle cx="380" cy="215" r="205" stroke="#3dff7a" stroke-width="2" fill="none" stroke-dasharray="3 12"/></g>
      <path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L380 72"/><circle class="pul" data-x="380" data-y="72" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="380" cy="72" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="380" y="34" text-anchor="middle" class="fx" data-t="1.6">CLIENTE</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L535 144"/><circle class="pul" data-x="535" data-y="144" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="535" cy="144" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="535" y="106" text-anchor="middle" class="fx" data-t="1.75">DATOS</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L535 286"/><circle class="pul" data-x="535" data-y="286" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="535" cy="286" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="535" y="334" text-anchor="middle" class="fx" data-t="1.9000000000000001">PROPUESTA</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L380 358"/><circle class="pul" data-x="380" data-y="358" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="380" cy="358" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="380" y="406" text-anchor="middle" class="fx" data-t="2.05">PRECIO</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L225 286"/><circle class="pul" data-x="225" data-y="286" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="225" cy="286" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="225" y="334" text-anchor="middle" class="fx" data-t="2.2">MERCADO</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M380 215 L225 144"/><circle class="pul" data-x="225" data-y="144" r="6" fill="#b9ffd0" opacity="0"/><circle stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" cx="225" cy="144" r="26"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="225" y="106" text-anchor="middle" class="fx" data-t="2.35">CIERRE</text>
      <circle cx="380" cy="215" r="62" fill="rgba(2,16,6,.95)" stroke="#3dff7a" stroke-width="4"/>
      <path id="engr" fill="none" stroke="#3dff7a" stroke-width="5" stroke-linejoin="round" d=""/>
      <circle cx="380" cy="215" r="11" fill="#3dff7a"/>
    </svg><div class="tapa abs"></div><div class="scan abs"></div>
      <i class="esq a"></i><i class="esq b"></i><i class="esq c"></i><i class="esq d"></i></div>
    <div class="tit" id="t2"></div>
  </div>
</div>
<script>
  let s0 = 7; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;
  const D = "0123456789";
  const G = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:.=*+<>";
  // --- lluvia de números (función pura del tiempo) ---
  const F = 22, COLS = 1920 / F | 0, ROWS = 1080 / F | 0;
  const col = [...Array(COLS)].map(() => ({ v: 7 + rnd() * 14, off: rnd() * 60, len: 10 + (rnd() * 26 | 0) }));
  const cx = document.getElementById("lluvia").getContext("2d");
  const dig = (a, b, t) => G[(a * 131 + b * 17 + Math.floor(t * 9 + a)) % G.length];
  function lluvia(t) {
    cx.fillStyle = "#020a04"; cx.fillRect(0, 0, 1920, 1080);
    cx.font = F + "px monospace";
    col.forEach((c, i) => {
      const head = Math.floor(c.off + t * c.v) % (ROWS + c.len + 10);
      for (let j = 0; j < c.len; j++) {
        const row = head - j; if (row < 0 || row > ROWS) continue;
        cx.fillStyle = j === 0 ? "rgba(220,255,230,.9)" : `rgba(43,255,106,${((1 - j / c.len) * .75).toFixed(2)})`;
        cx.fillText(dig(i, row, t), i * F, row * F);
      }
    });
  }
  // máquina de escribir: letra por letra a ritmo constante
  function maquina(el, g, t, cursorFijo) {
    if (t < g[0]) { el.textContent = ""; return; }
    const n = Math.min(g[2].length, Math.floor((t - g[0]) / ((g[1] - g[0]) * 0.8) * g[2].length));
    const cur = n < g[2].length || (cursorFijo && Math.floor(t * 2.5) % 2 === 0) ? "▌" : "";
    el.textContent = g[2].slice(0, n) + cur;
  }
  // textos: cada imagen con su subtítulo
  const TXT = [
    ["mod", [0.2, 1.2, "> MÓDULO_01 // ARCHIVOS DESBLOQUEADOS"]],
    ["h", [0.4, 1.6, "BUSINESS MATRIX"]],
    ["t1", [2.6, 3.6, "Frame de Cotización"]],
    ["t2", [4.4, 5.4, "Ingeniería Comercial"]],
  ];
  const st = { t: 0 };
  function pintar() {
    const t = st.t;
    lluvia(t); hud(t);
    TXT.forEach(([id, g]) => maquina(document.getElementById(id), g, t, false));
  }
  // --- HUD: anillos que giran, cifras que se descifran, pulsos por la red, engranaje ---
  const D10 = "0123456789";
  const fx = [...document.querySelectorAll(".fx")], cifras = [...document.querySelectorAll(".dig")], pul = [...document.querySelectorAll(".pul")];
  cifras.forEach(d => d.dataset.base = d.textContent);
  function engranaje(r1, r2, n, rot) {
    let d = "";
    for (let i = 0; i < n * 2; i++) {
      const a0 = rot + i * Math.PI / n, a1 = a0 + Math.PI / n * .55, r = i % 2 ? r1 : r2;
      d += (i ? "L" : "M") + (380 + r * Math.cos(a0)).toFixed(1) + " " + (215 + r * Math.sin(a0)).toFixed(1) + "L" + (380 + r * Math.cos(a1)).toFixed(1) + " " + (215 + r * Math.sin(a1)).toFixed(1);
    }
    return d + "Z";
  }
  function hud(t) {
    document.getElementById("anA").setAttribute("transform", `rotate(${t * 12} 240 220)`);
    document.getElementById("anB").setAttribute("transform", `rotate(${-t * 20} 240 220)`);
    document.getElementById("anC").setAttribute("transform", `rotate(${t * 10} 380 215)`);
    document.getElementById("engr").setAttribute("d", engranaje(30, 42, 10, t * 0.8));
    fx.forEach(e => e.style.opacity = t >= +e.dataset.t ? 1 : 0);
    // las cifras nunca se fijan: se ven "descifrándose" (no son datos reales)
    cifras.forEach((e, k) => { e.style.opacity = t >= +e.dataset.t ? 1 : 0; e.textContent = e.dataset.base.replace(/0/g, (m, j) => D10[(Math.floor(t * 14) * 7 + j * 3 + k * 5) % 10]); });
    const on = t > 4.6;
    pul.forEach((e, k) => {
      const f = ((t * 0.55 + k / 6) % 1);
      e.setAttribute("cx", 380 + (e.dataset.x - 380) * f); e.setAttribute("cy", 215 + (e.dataset.y - 215) * f);
      e.setAttribute("opacity", on ? (Math.sin(f * Math.PI)).toFixed(2) : 0);
    });
  }
  const DUR = 10;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  // cada imagen se "descarga": aparece el marco y una línea de escaneo la revela de arriba hacia abajo
  [["#c1", 1.2], ["#c2", 3.0]].forEach(([c, d]) => {
    tl.fromTo(c + " .marco", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, d);
    tl.fromTo(c + " .tapa", { scaleY: 1 }, { scaleY: 0, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.fromTo(c + " .scan", { y: 0, opacity: 1 }, { y: 516, opacity: 1, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.to(c + " .scan", { opacity: 0, duration: 0.2 }, d + 1.5);
    // el ícono se dibuja trazo por trazo
    tl.fromTo(c + " .tr", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, stagger: 0.12, ease: "power1.inOut", immediateRender: false }, d + 0.5);
  });
  window.__timelines = window.__timelines || {};
  tl.fromTo("#sello", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false, svgOrigin: "0 0" }, 3.7);
  window.__timelines["m1-ppt"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: tras la entrada, la lluvia sigue en bucle
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    if (t < DUR) tl.seek(t); else { st.t = t; pintar(); }
  });
</script>
</body></html>
