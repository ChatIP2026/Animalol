<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #room { z-index: 6; position: absolute; left: -116px; top: 244px; width: 1312px; }
      .tag {
        position: absolute; z-index: 12;
        font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--lavender);
        white-space: nowrap; opacity: 0;
      }
      .tag::after {
        content: ""; position: absolute; left: 50%; bottom: -16px;
        width: 2px; height: 12px; background: var(--lavender); opacity: 0.6;
      }
      #tagPost { left: 902px; top: 506px; transform: translateX(-50%); }
      #tagWork { left: 300px; top: 448px; transform: translateX(-50%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e1-oficina" data-width="1080" data-height="1350">
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>

      <svg id="room" viewBox="0 0 1080 880" fill="none">
        <path d="M0 706 H1080" stroke="#6d5f8c" stroke-width="5" opacity="0.6"/>
        <g id="door" opacity="0.45">
          <rect x="902" y="286" width="150" height="420" rx="5"
            stroke="#6d5f8c" stroke-width="6" fill="rgba(109,95,140,0.10)"/>
          <circle cx="926" cy="520" r="8" fill="#6d5f8c"/>
        </g>

        <!-- silla: respaldo visible por encima del escritorio -->
        <path d="M214 500 V372 a20 20 0 0 1 20 -20 h26" stroke="#6d5f8c" stroke-width="16"
          stroke-linecap="round" fill="none"/>

        <!-- EL RECLUTADOR. Silueta sólida y encorvada: de la cintura para abajo
             lo tapa el escritorio, igual que en la referencia. -->
        <g id="worker">
          <g id="body">
            <path d="M252 532 C236 450 248 384 292 352 C314 334 340 330 356 344
                     L380 368 C390 410 382 474 378 532 Z" fill="#f6f4fa"/>
            <ellipse id="head" cx="366" cy="304" rx="48" ry="44"
              transform="rotate(-24 366 304)" fill="#f6f4fa"/>
            <path id="arm" d="M362 392 L448 456 L540 480" stroke="#f6f4fa" stroke-width="32"
              stroke-linecap="round" stroke-linejoin="round" fill="none"/>
            <path d="M534 470 h34 a9 9 0 0 1 0 18 h-34 Z" fill="#f6f4fa"/>
          </g>
        </g>

        <!-- ESCRITORIO macizo, no de patas finas -->
        <rect x="158" y="486" width="668" height="28" rx="7" fill="#c9bedd"/>
        <path d="M190 514 H796 V706 H190 Z" fill="#7d6fa0"/>
        <path d="M188 514 H798 V532 H188 Z" fill="#7a6d9c"/>
        <!-- hoja sobre la que escribe -->
        <rect x="476" y="466" width="118" height="22" rx="4" fill="#e4d6f7" opacity="0.65"/>

        <g id="stack"></g>

        <!-- EL POSTULANTE: misma silueta sólida, de pie -->
        <g id="applicant" opacity="0">
          <path d="M-62 448 C-100 448 -110 508 -110 598 L-108 706 L-66 706 L-64 606
                   L-60 606 L-58 706 L-16 706 L-14 598 C-14 508 -24 448 -62 448 Z"
            fill="#f6f4fa"/>
          <path d="M-74 420 h24 v34 h-24 Z" fill="#f6f4fa"/>
          <circle cx="-62" cy="398" r="40" fill="#f6f4fa"/>
          <path id="appArm" d="M-62 486 L-134 520" stroke="#f6f4fa" stroke-width="28"
            stroke-linecap="round"/>
          <g id="cvHand">
            <rect x="-180" y="492" width="62" height="46" rx="4" fill="#e4d6f7"/>
            <g fill="#4a267f"><rect x="-172" y="502" width="36" height="5" rx="2"/>
            <rect x="-172" y="514" width="44" height="5" rx="2"/>
            <rect x="-172" y="526" width="24" height="5" rx="2"/></g>
          </g>
        </g>
      </svg>

      <div class="tag" id="tagWork">reclutador</div>
      <div class="tag" id="tagPost">postulante</div>
      <div class="vignette"></div>
    </div>

    <script>
      // La pila inicial. Cada hoja es su propio elemento para que la nueva se sume encima.
      const stack = document.getElementById("stack");
      const SVGNS = "http://www.w3.org/2000/svg";
      function sheet(i, id) {
        const r = document.createElementNS(SVGNS, "rect");
        const w = 152 + Math.sin(i * 2.4) * 14;
        const x = 630 + Math.cos(i * 1.9) * 9;
        const y = 466 - i * 19;
        r.setAttribute("x", x); r.setAttribute("y", y);
        r.setAttribute("width", w); r.setAttribute("height", 17);
        r.setAttribute("rx", 3);
        r.setAttribute("fill", i % 2 ? "#85207b" : "#7b3ff2");
        // cada hoja cae con su propio ángulo: una pila real no está perfecta
        r.setAttribute("transform",
          "rotate(" + (Math.sin(i * 3.3) * 1.6).toFixed(2) + " " + (x + w / 2) + " " + (y + 8) + ")");
        if (id) r.id = id;
        stack.appendChild(r);
        return r;
      }
      for (let i = 0; i < 8; i++) sheet(i);
      const newSheet = sheet(8, "newSheet");

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", { y: 0 }, { y: 26, duration: 3.2, ease: "none" }, 0);

      // 0.0 - 0.7 · el lugar y quién es. Ya está trabajando cuando empieza el video.
      gsap.set("#arm", { transformOrigin: "362px 392px" });
      gsap.set("#newSheet", { opacity: 0 });
      gsap.set("#applicant", { opacity: 0 });
      tl.fromTo("#tagWork", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.1);
      tl.to("#arm", { rotation: -3.5, duration: 0.3, repeat: 9, yoyo: true, ease: "sine.inOut" }, 0);

      // 0.7 - 1.7 · entra el postulante (un bob vertical lee como caminata)
      tl.set("#applicant", { opacity: 1 }, 0.7);
      tl.fromTo("#applicant", { x: 1320 }, { x: 900, duration: 1.0, ease: "power2.out" }, 0.7);
      tl.to("#applicant", { y: -9, duration: 0.17, repeat: 5, yoyo: true, ease: "sine.inOut" }, 0.7);
      tl.fromTo("#tagPost", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.95);

      // 1.7 - 2.2 · deja el CV sobre la pila. La pila crece.
      tl.to("#appArm", { attr: { d: "M-62 486 L-150 430" }, duration: 0.3, ease: "power2.out" }, 1.7);
      tl.to("#cvHand", { y: -118, x: -22, duration: 0.3, ease: "power2.out" }, 1.7);
      tl.to("#cvHand", { opacity: 0, duration: 0.01 }, 2.0);
      tl.fromTo("#newSheet", { opacity: 0, y: -40 },
        { opacity: 1, y: 0, duration: 0.3, ease: "power3.in" }, 2.0);
      tl.fromTo("#stack", { y: 0 }, { y: -3, duration: 0.1, yoyo: true, repeat: 1 }, 2.3);

      // 2.2 - 3.2 · se va. Y detrás ya viene el siguiente.
      tl.to("#tagPost", { opacity: 0, duration: 0.25 }, 2.3);
      tl.to("#applicant", { x: 1320, duration: 0.85, ease: "power2.in" }, 2.35);
      tl.to("#applicant", { y: -9, duration: 0.17, repeat: 4, yoyo: true, ease: "sine.inOut" }, 2.35);
      tl.to("#door", { opacity: 1, duration: 0.3 }, 2.9);

      window.__timelines = window.__timelines || {};
      window.__timelines["e1-oficina"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
