      // sincronizado con la voz: "hemos desbloqueado" (22.9–24.3 s) arma la línea 1, "la Matrix" (24.5–25.4 s) la línea 2
      const l2 = y > 565;
      P.push({ x, y, linea2: l2, t0: l2 ? 24.5 + ((x - 480) / 970) * 0.7 + r * 0.25 : 22.9 + ((x - 115) / 1695) * 1.1 + r * 0.3, caida: 250 + r * 700, k: (x * 7 + y * 3) % 10 });
    }
  const ct = document.getElementById("titulo").getContext("2d");
  const DUR_CAIDA = 0.6;
  function titulo(t, brillo) {
    ct.clearRect(0, 0, 1920, 1080);
    ct.font = "bold 11px monospace"; ct.textAlign = "center"; ct.textBaseline = "middle";
    P.forEach(p => {
      const u = (t - p.t0) / DUR_CAIDA; if (u < 0) return;
      const e = u >= 1 ? 1 : 1 - Math.pow(1 - u, 3);
      const y = p.y - p.caida * (1 - e);
      const fijo = u >= 1;
      ct.fillStyle = fijo ? (p.linea2 ? `rgba(61,255,122,${brillo})` : `rgba(220,255,230,${brillo})`) : "rgba(43,255,106,.8)";
      ct.fillText(fijo ? D[p.k] : D[(p.k + Math.floor(t * 20)) % 10], p.x, y);
    });
  }
  const st = { t: 0, b: 0.85 };
  // --- Jaina: esfera de partículas que se va formando, gira y respira ---
  let sj = 11; const rj = () => (sj = (sj * 16807) % 2147483647) / 2147483647;
  const cj = document.getElementById("jaina").getContext("2d"), PJ = [];
  for (let i = 0; i < 3200; i++) {
    const u = rj() * 2 - 1, a = rj() * 6.2832, r = Math.sqrt(1 - u * u);
    // más densidad hacia los polos, como la esfera de referencia
    const y = Math.sign(u) * Math.pow(Math.abs(u), 0.7), rr = Math.sqrt(1 - y * y);
    PJ.push({ x: Math.cos(a) * rr, y, z: Math.sin(a) * rr, b: 0.4 + rj() * 1.9, s: 1 + rj() * 1.4, k: 1.5 + rj() * 1.5 });
  }
  const forma = t => Math.min(1, Math.max(0, (t - 0.4) / 2.1));
  function jaina(t) {
    const br = Math.pow(0.5 + 0.5 * Math.sin(t * 1.35), 1.6), R = 230 * (1 + 0.04 * br + 0.05 * habla(t)), ry = t * 0.35, c = Math.cos(ry), sn = Math.sin(ry);
    cj.clearRect(0, 0, 600, 600);
    const f = forma(t);
    // fondo oscuro detrás de la esfera: la lluvia nunca se ve a través de Jaina
    const o = cj.createRadialGradient(300, 300, R * .9, 300, 300, R * 1.12);
    o.addColorStop(0, `rgba(2,10,4,${.96 * f})`); o.addColorStop(1, "rgba(2,10,4,0)");
    cj.fillStyle = o; cj.beginPath(); cj.arc(300, 300, R * 1.12, 0, 7); cj.fill();
    const g = cj.createRadialGradient(300, 300, 0, 300, 300, R * 1.1);
    g.addColorStop(0, `rgba(43,255,106,${(.10 + .08 * br) * f})`); g.addColorStop(1, "rgba(43,255,106,0)");
    cj.fillStyle = g; cj.beginPath(); cj.arc(300, 300, R * 1.1, 0, 7); cj.fill();
    PJ.forEach(p => {
      const e = Math.min(1, Math.max(0, (t - p.b) / 0.8)); if (e <= 0) return;
      const ee = 1 - Math.pow(1 - e, 3), sc = R * (1 + (p.k - 1) * (1 - ee));
      const X = p.x * c + p.z * sn, Z = -p.x * sn + p.z * c, d = (Z + 1) / 2;
      cj.fillStyle = `rgba(${(120 + 110 * d) | 0},255,${(150 + 80 * d) | 0},${((.25 + .75 * d) * ee).toFixed(2)})`;
      cj.fillRect(300 + X * sc, 300 + p.y * sc, p.s, p.s);
    });
    // letra J brillante, como el logo de Jaina
    const u = R / 300;
    cj.save(); cj.globalAlpha = Math.min(1, Math.max(0, (t - 2.0) / 0.5)); cj.translate(300, 300); cj.scale(u, u);
    cj.lineWidth = 13; cj.lineCap = "round"; cj.lineJoin = "round";
    cj.shadowColor = "#2bff6a"; cj.shadowBlur = 30 + 20 * br; cj.strokeStyle = "#f2fff5";
    cj.beginPath(); cj.moveTo(-22, -92); cj.lineTo(55, -92); cj.lineTo(55, 32); cj.arc(0, 32, 55, 0, Math.PI * .85); cj.stroke();
    cj.restore();
    document.getElementById("halo").style.opacity = (.4 + .6 * br) * f;
  }
  // --- guion de Jaina: [inicio, fin, texto]. Los tiempos se ajustarán al audio real ---
  // modo "abajo": subtítulo bajo Jaina; "centro": frase sola al medio, con corte seco.
  // Tiempos medidos palabra por palabra sobre el audio real de Jaina.
  // Paso 0 arranca con la slide (01a-intro.mp3 a los 2.8 s); paso 1 arranca con un toque
  // del presentador (01b-mario.mp3). En el render, el paso 1 cae a los 30.6 s.
  const PASO = [0, 30.6];
  const GUION = [
    [2.89, 12.0, "Hoy, muchos ven la inteligencia artificial como una Matrix: un sistema que decide por nosotros, que nos observa… y que nos controla.", "abajo", 0],
    [12.41, 16.2, "Pero nosotros vimos otra cosa. Vimos una puerta.", "abajo", 0],
    [16.51, 20.3, "Una forma de trabajar mejor, más rápido y con propósito.", "abajo", 0],
    [20.89, 21.3, "¿Lo bueno?", "centro", 0],
    [21.47, 22.8, "Es que en iPartner…", "centro", 0],
    [0.55, 3.3, "Pero toda Matrix necesita a alguien que la enfrente…", "abajo", 1],
    [3.83, 4.5, "Con ustedes:", "abajo", 1],
  ];
  const NOM0 = [4.9, 6.4, "NEO MARIO MÉNDEZ"];
  const VOZ = [[2.89, 12.0, 0], [12.41, 16.2, 0], [16.51, 20.3, 0], [20.89, 21.3, 0], [21.47, 25.2, 0], [0.55, 3.3, 1], [3.83, 4.5, 1], [4.9, 6.4, 1]];
  // pasa un tramo [inicio, fin, …, paso] a tiempo absoluto de la slide
  const abs = g => g[g.length - 1] ? [g[0] + PASO[1], g[1] + PASO[1], ...g.slice(2)] : g;
  function habla(t) {
    if (!VOZ.map(abs).some(([a, b]) => t >= a && t <= b)) return 0;
    return Math.abs(Math.sin(t * 11) * Math.sin(t * 4.3 + 1));
  }
  const sub = document.getElementById("sub"), cen = document.getElementById("cen");
  // máquina de escribir: letra por letra a ritmo constante, con cursor que parpadea
  function maquina(el, g, t) {
    if (!g) { el.textContent = ""; return; }
    const n = Math.min(g[2].length, Math.floor((t - g[0]) / ((g[1] - g[0]) * 0.8) * g[2].length));
    const cursor = n < g[2].length || Math.floor(t * 2.5) % 2 === 0 ? "▌" : "\u00a0";
    el.textContent = g[2].slice(0, Math.max(0, n)) + cursor;
  }
  function subtitulo(t) {
    const g = GUION.map(abs).find(([a, b]) => t >= a && t <= b + 0.5);
    maquina(sub, g && g[3] === "abajo" ? g : null, t);
    maquina(cen, g && g[3] === "centro" ? g : null, t);
    sub.style.opacity = g && g[3] === "abajo" ? 1 : 0;
    const NOM = [NOM0[0] + PASO[1], NOM0[1] + PASO[1], NOM0[2]];
    maquina(document.getElementById("nom"), t >= NOM[0] ? NOM : null, t);
  }
  function pintar() { lluvia(st.t); titulo(st.t, st.b); jaina(st.t); subtitulo(st.t); }
  const DUR = 38;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  tl.to("#vel", { opacity: 1, duration: 0.8 }, 0.6);
  // Jaina aparece al centro, se presenta y se desplaza a la esquina inferior derecha
  tl.set("#jw", { opacity: 1 }, 0.4);
  tl.to("#jw", { x: 790, y: 370, scale: 0.42, duration: 1.2, ease: "power3.inOut" }, 19.6);
  // cuando el título está armado, brilla
  tl.to(st, { b: 1, duration: 0.3, onUpdate: pintar }, 26.0);
  tl.to("#titulo", { filter: "drop-shadow(0 0 10px #2bff6a) drop-shadow(0 0 26px rgba(43,255,106,.6))", duration: 0.4 }, 26.0);
  [26.2, 26.3, 26.4, 26.55, 26.65].forEach((d, i) => tl.to("#k", { opacity: i % 2 ? 0.2 : 1, duration: 0.03 }, d));
  window.__timelines = window.__timelines || {};
  window.__timelines["m0-apertura"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: presentacion.html envía el tiempo; tras la entrada, la lluvia sigue en bucle con el título fijo
  // voz de Jaina en modo presentación: arranca sincronizada con el reloj de la slide
  const VOCES = [["../assets/voz/01a-intro.mp3", 2.8], ["../assets/voz/01b-mario.mp3", Infinity]].map(([src, at]) => ({ a: new Audio(src), at, ok: false }));
  let enVivo = false;
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    // en vivo, el paso 1 espera el toque del presentador
    if (!enVivo) { enVivo = true; PASO[1] = Infinity; }
    if (e.data.paso >= 1 && PASO[1] === Infinity) { PASO[1] = t; VOCES[1].at = t + 0.4; }
    VOCES.forEach(v => { if (!v.ok && t >= v.at) { v.ok = true; v.a.currentTime = Math.max(0, t - v.at); v.a.play().catch(() => {}); } });
    // seek no dispara onUpdate (suppressEvents), así que se repinta a mano
    if (t < DUR) tl.seek(t); else st.t = t;
    pintar();
  });
</script>
