<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #room { z-index: 6; position: absolute; left: 0; top: 300px; width: 1080px; }
      .tag {
        position: absolute; z-index: 12;
        font-family: "IBM Plex Mono", monospace; font-size: 25px; font-weight: 500;
        letter-spacing: 0.18em; text-transform: uppercase; color: var(--lavender);
        white-space: nowrap; opacity: 0;
      }
      .tag::after {
        content: ""; position: absolute; left: 50%; bottom: -16px;
        width: 2px; height: 12px; background: var(--lavender); opacity: 0.6;
      }
      #tagBot { left: 268px; top: 352px; transform: translateX(-50%); }
      #tagRelax { left: 790px; top: 406px; transform: translateX(-50%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="e2-robot" data-width="1080" data-height="1350">
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>

      <!-- MISMO encuadre que la escena 1: piso, escritorio y puerta no se mueven.
           Lo único que cambió es quién está sentado. Esa comparación es el chiste. -->
      <svg id="room" viewBox="0 0 1080 760" fill="none">
        <path d="M0 622 H1080" stroke="#6d5f8c" stroke-width="5" opacity="0.65"/>
        <g opacity="0.5">
          <rect x="864" y="214" width="166" height="408" rx="6"
            stroke="#6d5f8c" stroke-width="6" fill="rgba(109,95,140,0.10)"/>
          <circle cx="890" cy="430" r="8" fill="#6d5f8c"/>
        </g>

        <!-- la silla del reclutador, ahora ocupada por el robot -->
        <path d="M150 452 V336 a16 16 0 0 1 16 -16 h18" stroke="#6d5f8c" stroke-width="13"
          stroke-linecap="round" fill="none"/>
        <path d="M162 452 V614" stroke="#6d5f8c" stroke-width="13" stroke-linecap="round"/>

        <g id="bot">
          <path d="M214 452 H288 V604" stroke="#f6f4fa" stroke-width="24"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <!-- torso -->
          <rect x="196" y="330" width="104" height="124" rx="26" fill="#f6f4fa"/>
          <rect x="222" y="396" width="52" height="13" rx="6" fill="#7b3ff2"/>
          <!-- cabeza con visor -->
          <rect x="188" y="238" width="122" height="90" rx="28" fill="#f6f4fa"/>
          <rect x="204" y="258" width="90" height="50" rx="18" fill="#17122b"/>
          <text id="eyes" x="249" y="292" font-family="IBM Plex Mono, monospace"
            font-size="34" font-weight="700" fill="#7b3ff2" text-anchor="middle">&gt; &lt;</text>
          <!-- auriculares, como en la referencia -->
          <circle cx="182" cy="284" r="17" fill="#7b3ff2"/>
          <circle cx="316" cy="284" r="17" fill="#7b3ff2"/>
          <!-- brazos sobre la laptop -->
          <path id="armL" d="M226 388 L330 420" stroke="#f6f4fa" stroke-width="22"
            stroke-linecap="round"/>
          <path id="armR" d="M278 388 L372 420" stroke="#f6f4fa" stroke-width="22"
            stroke-linecap="round"/>
        </g>

        <!-- escritorio: idéntico al de la escena 1 -->
        <rect x="178" y="428" width="560" height="22" rx="8" fill="#b5a9cc"/>
        <rect x="196" y="450" width="18" height="172" rx="7" fill="#b5a9cc"/>
        <rect x="700" y="450" width="18" height="172" rx="7" fill="#b5a9cc"/>

        <!-- la laptop: lo que hay dentro es la escena 3 -->
        <g id="laptop">
          <path d="M330 428 H444 L456 330 H342 Z" fill="#2a1f4d" stroke="#b5a9cc" stroke-width="5"/>
          <path d="M350 420 H438 L448 344 H358 Z" fill="#7b3ff2" opacity="0.26"/>
          <rect x="320" y="428" width="140" height="11" rx="5" fill="#b5a9cc"/>
        </g>

        <!-- el postulante, esperando cómodo mientras la IA le escribe el CV -->
        <g id="relax" opacity="0">
          <path d="M742 404 V330 a14 14 0 0 1 14 -14 h16" stroke="#6d5f8c" stroke-width="12"
            stroke-linecap="round" fill="none"/>
          <path d="M754 404 V614" stroke="#6d5f8c" stroke-width="12" stroke-linecap="round"/>
          <path d="M770 402 H846 L870 500 V604" stroke="#f6f4fa" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M764 404 L784 326" stroke="#f6f4fa" stroke-width="48" stroke-linecap="round"/>
          <circle cx="790" cy="286" r="38" fill="#f6f4fa"/>
          <path d="M778 336 L742 268 L792 258" stroke="#f6f4fa" stroke-width="20"
            stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </g>

        <!-- los CVs que la laptop empieza a escupir -->
        <g id="outflow"></g>
      </svg>

      <div class="tag" id="tagBot">IA</div>
      <div class="tag" id="tagRelax">postulante</div>
      <div class="vignette"></div>
    </div>

    <script>
      const SVGNS = "http://www.w3.org/2000/svg";
      const outflow = document.getElementById("outflow");
      const docs = [];
      for (let i = 0; i < 6; i++) {
        const g = document.createElementNS(SVGNS, "g");
        g.setAttribute("opacity", "0");
        const r = document.createElementNS(SVGNS, "rect");
        r.setAttribute("x", 396); r.setAttribute("y", 352);
        r.setAttribute("width", 46); r.setAttribute("height", 60);
        r.setAttribute("rx", 4); r.setAttribute("fill", "#e4d6f7");
        g.appendChild(r);
        for (let k = 0; k < 3; k++) {
          const l = document.createElementNS(SVGNS, "rect");
          l.setAttribute("x", 404); l.setAttribute("y", 362 + k * 12);
          l.setAttribute("width", k === 2 ? 18 : 30); l.setAttribute("height", 5);
          l.setAttribute("rx", 2); l.setAttribute("fill", "#4a267f");
          g.appendChild(l);
        }
        outflow.appendChild(g);
        docs.push(g);
      }

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", { y: 26 }, { y: 54, duration: 4.2, ease: "none" }, 0);

      // 0.0 - 0.9 · mismo plano, otro ocupante. Que se note el reemplazo.
      gsap.set("#armL", { transformOrigin: "226px 388px" });
      gsap.set("#armR", { transformOrigin: "278px 388px" });
      tl.fromTo("#bot", { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0);
      tl.fromTo("#tagBot", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.45);

      // teclea sin parar, a ritmo de máquina (no de persona)
      tl.to("#armL", { rotation: 7, duration: 0.11, repeat: 32, yoyo: true, ease: "steps(1)" }, 0.5);
      tl.to("#armR", { rotation: -7, duration: 0.11, repeat: 32, yoyo: true, ease: "steps(1)" }, 0.61);
      tl.to("#laptop path:nth-of-type(2)", { opacity: 0.5, duration: 0.18,
        repeat: 11, yoyo: true, ease: "sine.inOut" }, 0.5);

      // 0.9 - 2.1 · el postulante entra en cuadro, cómodo. No hace nada, y ese es el punto.
      tl.fromTo("#relax", { opacity: 0, x: 44 },
        { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 0.95);
      tl.fromTo("#tagRelax", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.3 }, 1.35);

      // 2.1 - 4.2 · la laptop empieza a escupir CVs: el puente hacia la escena 3
      docs.forEach((d, i) => {
        tl.fromTo(d, { opacity: 0, x: 0, y: 0, scale: 0.6 },
          { opacity: 1, x: 120 + i * 34, y: -70 - (i % 3) * 36, scale: 1,
            duration: 0.5, ease: "power2.out" }, 2.1 + i * 0.26);
      });
      tl.to("#eyes", { opacity: 0.25, duration: 0.09, repeat: 3, yoyo: true,
        ease: "steps(1)" }, 2.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["e2-robot"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
