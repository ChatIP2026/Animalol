<!doctype html>
<html lang="es"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Matrix 2026</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  #escena{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center}
  iframe{width:1920px;height:1080px;border:0;display:block}
  #capa{position:fixed;inset:0;cursor:pointer}
  #inicio{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#020a04;color:#3dff7a;font:28px monospace;letter-spacing:.4em;cursor:pointer;z-index:5;text-shadow:0 0 12px rgba(43,255,106,.7)}
  .nav{position:fixed;bottom:0;width:90px;height:90px;display:flex;align-items:center;justify-content:center;font:52px monospace;color:#3dff7a;opacity:.25;cursor:pointer;z-index:4;user-select:none}
  .nav:hover{opacity:.8}
  #atras{left:0} #sig{right:60px}
  #num{position:fixed;right:16px;bottom:12px;font:14px monospace;color:#3dff7a;opacity:.4}
</style></head><body>
<div id="escena"><iframe id="f"></iframe></div>
<div id="capa"></div>
<div id="atras" class="nav">‹</div><div id="sig" class="nav">›</div>
<div id="inicio">TOCA PARA COMENZAR</div><div id="num"></div>
<script>
  // orden de slides: se irán agregando aquí
  const SLIDES = ["compositions/m0-apertura.html", "compositions/m-balas.html", "compositions/m1-business.html", "compositions/m1-ppt.html", "compositions/m2-ppt.html", "compositions/m3-ppt.html", "compositions/m4-ppt.html", "compositions/m5-ppt.html", "compositions/m6-final.html"];
  let i = 0;
  const f = document.getElementById("f"), esc = document.getElementById("escena");
  function ir(n) {
    if (document.getElementById("inicio")) return;
    if (n < 0 || n >= SLIDES.length) return;
    i = n; f.src = SLIDES[i]; t0 = performance.now();
    document.getElementById("num").textContent = (i + 1) + " / " + SLIDES.length;
  }
  function ajustar() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); esc.style.transform = `translate(-50%,-50%) scale(${k})`; }
  addEventListener("resize", ajustar); ajustar();
  addEventListener("keydown", e => {
    if (["ArrowRight","ArrowDown","PageDown"," ","Enter"].includes(e.key)) ir(i + 1);
    if (["ArrowLeft","ArrowUp","PageUp"].includes(e.key)) ir(i - 1);
    if (e.key === "f") document.documentElement.requestFullscreen?.();
  });
  let x0 = null;
  addEventListener("touchstart", e => x0 = e.touches[0].clientX);
  addEventListener("touchend", e => { if (x0 === null) return; const d = e.changedTouches[0].clientX - x0; if (Math.abs(d) > 50) { deslizo = true; ir(d < 0 ? i + 1 : i - 1); } x0 = null; });
  // tocar o hacer clic avanza; los botones ‹ › permiten retroceder y avanzar
  let deslizo = false;
  document.getElementById("capa").addEventListener("click", () => { if (!deslizo) ir(i + 1); deslizo = false; });
  document.getElementById("atras").addEventListener("click", e => { e.stopPropagation(); ir(i - 1); });
  document.getElementById("sig").addEventListener("click", e => { e.stopPropagation(); ir(i + 1); });
  // reloj de la presentación: le pasa el tiempo a la slide actual
  let t0 = 0;
  (function reloj() { f.contentWindow?.postMessage({ t: (performance.now() - t0) / 1000 }, "*"); requestAnimationFrame(reloj); })();
  // el primer toque activa el sonido del navegador y arranca el slide 1
  const ini = document.getElementById("inicio");
  ini.addEventListener("click", () => { ini.remove(); ir(0); }, { once: true });
</script>
</body></html>
