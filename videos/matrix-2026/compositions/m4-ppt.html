  .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:"Maquina",monospace;font-size:28px;color:rgba(61,255,122,.5);text-align:center}
  .ph small{font-size:18px;opacity:.7;margin-top:8px}

="380" cy="215" r="58" fill="#03200d" stroke="#3dff7a" stroke-width="4"/><g data-rot="-30 380 215"><circle cx="380" cy="215" r="46" stroke="#3dff7a" stroke-width="2" fill="none" stroke-dasharray="20 8"/></g><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="22" x="380" y="213" text-anchor="middle" class="fx" data-t="2.0">ODOO</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="14" x="380" y="237" text-anchor="middle" class="fx" data-t="2.2">ERP</text></svg><div class="tapa abs"></div><div class="scan abs"></div>

  <div id="c2" class="abs card">
    <div class="marco"><svg class="ico" viewBox="0 0 760 440"><rect stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" x="50" y="100" width="150" height="190" rx="8"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="18" x="125" y="135" text-anchor="middle" class="fx" data-t="1.8">FACTURA</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M75 165 H175"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M75 193 H175"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M75 221 H175"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="2.5" d="M75 249 H175"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M215 195 H305"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M290 182 L305 195 L290 208"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" d="M320 150 L380 110 L440 150 Z"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" d="M330 155 H430"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="5" d="M340 165 V245"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="5" d="M366 165 V245"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="5" d="M392 165 V245"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="5" d="M418 165 V245"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="4" d="M322 255 H438"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="20" x="380" y="290" text-anchor="middle" class="fx" data-t="2.4">BCP</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="14" x="380" y="312" text-anchor="middle" class="fx" data-t="2.6">FACTORING</text><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M455 195 H545"/><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M530 182 L545 195 L530 208"/><ellipse stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" cx="630" cy="245" rx="58" ry="14"/><ellipse stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" cx="630" cy="223" rx="58" ry="14"/><ellipse stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" cx="630" cy="201" rx="58" ry="14"/><ellipse stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" cx="630" cy="179" rx="58" ry="14"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="30" x="630" y="170" text-anchor="middle" class="fx" data-t="3.0">S/</text><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="16" x="630" y="290" text-anchor="middle" class="fx" data-t="3.2">LIQUIDEZ</text><g data-mov="125,195;380,195;630,195|3|0.0|3.6" opacity="0"><rect x="-14" y="-18" width="28" height="36" rx="3" fill="rgba(61,255,122,.25)" stroke="#3dff7a" stroke-width="2"/></g><g data-mov="125,195;380,195;630,195|3|0.3333333333333333|3.6" opacity="0"><rect x="-14" y="-18" width="28" height="36" rx="3" fill="rgba(61,255,122,.25)" stroke="#3dff7a" stroke-width="2"/></g><g data-mov="125,195;380,195;630,195|3|0.6666666666666666|3.6" opacity="0"><rect x="-14" y="-18" width="28" height="36" rx="3" fill="rgba(61,255,122,.25)" stroke="#3dff7a" stroke-width="2"/></g><path stroke="#3dff7a" fill="none" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="tr" stroke-width="3" d="M60 400 L150 385 L240 392 L330 365 L420 372 L510 340 L600 345 L700 312"/><text font-family="Maquina, monospace" fill="#c8ffd8" font-size="15" x="60" y="355" text-anchor="start" class="fx" data-t="4.0">FLUJO DE CAJA ▲</text></svg><div class="tapa abs"></div><div class="scan abs"></div>

</div>
<script>
  let s0 = 7; const rnd = () => (s0 = (s0 * 16807) % 2147483647) / 2147483647;
  const D = "0123456789";
  const G = "アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワン0123456789Z:.=*+<>";
  // --- lluvia de números (función pura del tiempo) ---
  const F = 22, COLS = 1920 / F | 0, ROWS = 1080 / F | 0;
  const col = [...Array(COLS)].map(() => ({ v: 7 + rnd() * 14, off: rnd() * 60, len: 10 + (rnd() * 26 | 0) }));
  const cx = document.getElementById("lluvia").getContext("2d");
  const dig = (a, b, t) => G[(a * 131 + b * 17 + Math.floor(t * 9 + a)) % G.length];
  function lluvia(t) {
    cx.fillStyle = "#020a04"; cx.fillRect(0, 0, 1920, 1080);
    cx.font = F + "px monospace";
    col.forEach((c, i) => {
      const head = Math.floor(c.off + t * c.v) % (ROWS + c.len + 10);
      for (let j = 0; j < c.len; j++) {
        const row = head - j; if (row < 0 || row > ROWS) continue;
        cx.fillStyle = j === 0 ? "rgba(220,255,230,.9)" : `rgba(43,255,106,${((1 - j / c.len) * .75).toFixed(2)})`;
        cx.fillText(dig(i, row, t), i * F, row * F);
      }
    });
  }
  // máquina de escribir: letra por letra a ritmo constante
  function maquina(el, g, t, cursorFijo) {
    if (t < g[0]) { el.textContent = ""; return; }
    const n = Math.min(g[2].length, Math.floor((t - g[0]) / ((g[1] - g[0]) * 0.8) * g[2].length));
    const cur = n < g[2].length || (cursorFijo && Math.floor(t * 2.5) % 2 === 0) ? "▌" : "";
    el.textContent = g[2].slice(0, n) + cur;
  }
  // textos: cada imagen con su subtítulo
  const TXT = [
    ["mod", [0.2, 1.2, "> MÓDULO_04 // ARCHIVOS DESBLOQUEADOS"]],
    ["h", [0.4, 1.6, "FINANCE MATRIX"]],
    ["t1", [2.6, 3.6, "Implementación Odoo"]],
    ["t2", [4.4, 5.4, "Factoring BCP"]],
  ];
  const st = { t: 0 };
  function pintar() {
    const t = st.t;
    lluvia(t); hud(t);
    TXT.forEach(([id, g]) => maquina(document.getElementById(id), g, t, false));
  }
  // --- HUD: anillos que giran, cifras que se descifran, pulsos por la red, engranaje ---
  const D10 = "0123456789";
  const fx = [...document.querySelectorAll(".fx")], cifras = [...document.querySelectorAll(".dig")], pul = [...document.querySelectorAll(".pul")];
  cifras.forEach(d => d.dataset.base = d.textContent);
  const rots = [...document.querySelectorAll("[data-rot]")], movs = [...document.querySelectorAll("[data-mov]")], ondas = [...document.querySelectorAll(".onda")], parps = [...document.querySelectorAll(".parp")], relojes = [...document.querySelectorAll(".reloj")];
  // animación continua de los visuales (función pura del tiempo, sirve igual en render y en bucle)
  function hud(t) {
    rots.forEach(e => { const [v, x, y] = e.dataset.rot.split(" ").map(Number); e.setAttribute("transform", `rotate(${t * v} ${x} ${y})`); });
    fx.forEach(e => e.style.opacity = t >= +e.dataset.t ? 1 : 0);
    // las cifras nunca se fijan: se ven "descifrándose" (no son datos reales)
    cifras.forEach((e, k) => { e.style.opacity = t >= +e.dataset.t ? 1 : 0; e.textContent = e.dataset.base.replace(/0/g, (m, j) => D10[(Math.floor(t * 14) * 7 + j * 3 + k * 5) % 10]); });
    pul.forEach((e, k) => {
      const [x1, y1, x2, y2] = e.dataset.a.split(",").map(Number), f = (t * 0.6 + k * 0.37) % 1;
      e.setAttribute("cx", x1 + (x2 - x1) * f); e.setAttribute("cy", y1 + (y2 - y1) * f);
      e.setAttribute("opacity", t > +e.dataset.on ? Math.sin(f * Math.PI).toFixed(2) : 0);
    });
    // elementos que recorren una ruta en bucle: data-mov="x,y;x,y;…|periodo|desfase|inicio"
    movs.forEach(e => {
      const [ruta, per, off, ini] = e.dataset.mov.split("|"), P = ruta.split(";").map(p => p.split(",").map(Number));
      if (t < +ini) { e.setAttribute("opacity", 0); return; }
      const f = ((t - ini) / per + +off) % 1, n = P.length - 1, u = f * n, i = Math.min(n - 1, Math.floor(u)), r = u - i;
      e.setAttribute("transform", `translate(${(P[i][0] + (P[i + 1][0] - P[i][0]) * r).toFixed(1)} ${(P[i][1] + (P[i + 1][1] - P[i][1]) * r).toFixed(1)})`);
      e.setAttribute("opacity", Math.min(1, Math.sin(f * Math.PI) * 4).toFixed(2));
    });
    ondas.forEach((e, k) => { const h = t > +e.dataset.on ? 6 + Math.abs(Math.sin(t * 5 + k * .9) * Math.sin(t * 2.3 + k * .4)) * 70 : 0; e.setAttribute("y1", 200 - h); e.setAttribute("y2", 200 + h); });
    parps.forEach(e => e.style.opacity = t < +e.dataset.t ? 0 : Math.floor(t * 2) % 2 ? .2 : 1);
    relojes.forEach(e => { const s = Math.max(0, Math.floor(t - e.dataset.t)); e.style.opacity = t >= +e.dataset.t ? 1 : 0; e.textContent = "REC " + String(s / 60 | 0).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); });
  }
  const DUR = 10;
  const tl = gsap.timeline({ paused: true });
  tl.fromTo(st, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: pintar }, 0);
  // cada imagen se "descarga": aparece el marco y una línea de escaneo la revela de arriba hacia abajo
  [["#c1", 1.2], ["#c2", 3.0]].forEach(([c, d]) => {
    tl.fromTo(c + " .marco", { opacity: 0, scale: 0.96 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, d);
    tl.fromTo(c + " .tapa", { scaleY: 1 }, { scaleY: 0, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.fromTo(c + " .scan", { y: 0, opacity: 1 }, { y: 516, opacity: 1, duration: 1.2, ease: "none", immediateRender: false }, d + 0.3);
    tl.to(c + " .scan", { opacity: 0, duration: 0.2 }, d + 1.5);
    // el ícono se dibuja trazo por trazo
    tl.fromTo(c + " .tr", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, stagger: 0.12, ease: "power1.inOut", immediateRender: false }, d + 0.5);
  });
  window.__timelines = window.__timelines || {};
  window.__timelines["m4-ppt"] = tl;
  pintar(); tl.seek(0);
  // modo presentación: tras la entrada, la lluvia sigue en bucle
  addEventListener("message", e => {
    const t = e.data && e.data.t; if (typeof t !== "number") return;
    // seek no dispara onUpdate (suppressEvents), así que se repinta a mano
    if (t < DUR) tl.seek(t); else st.t = t;
    pintar();
  });
</script>
