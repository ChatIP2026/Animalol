<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <link rel="stylesheet" href="../base.css" />
    <script src="../../vendor/gsap.min.js"></script>
    <style>
      #orbit { position: absolute; inset: 0; transform-origin: 50% 50%; }
      .piece {
        position: absolute;
        background: linear-gradient(160deg, #2a1f4d, #201739);
        border: 2px solid rgba(180,150,230,0.38);
        display: flex; align-items: center; justify-content: center;
        opacity: 0;
      }
      /* cada pieza tiene forma propia: ninguna se repite */
      #p1 { width: 150px; height: 300px; border-radius: 14px; left: 118px; top: 330px; }
      #p2 { width: 300px; height: 136px; border-radius: 68px; left: 630px; top: 352px; }
      #p3 { width: 184px; height: 184px; border-radius: 50%; left: 150px; top: 790px; }
      #p4 { width: 268px; height: 170px; border-radius: 14px 44px 14px 44px; left: 640px; top: 800px; }
      #p5 { width: 210px; height: 112px; border-radius: 10px; left: 435px; top: 196px; }
      .piece svg { opacity: 0.85; }
      #cvSmall { left: 447px; top: 551px; z-index: 6; }
      #person {
        position: absolute; left: 50%; top: 625px; transform: translate(-50%, -50%);
        opacity: 0; z-index: 7;
      }
      #cap {
        position: absolute; left: 0; right: 0; bottom: 150px; text-align: center;
        z-index: 11; opacity: 0; font-size: 54px; font-weight: 800; color: var(--ink);
      }
      #cap b { color: var(--violet); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="s4-una-parte" data-width="1080" data-height="1350">
      <div class="mesh" id="mesh" data-layout-allow-overflow></div>
      <div class="glow glow-a" data-layout-allow-overflow></div>
      <div class="glow glow-b" data-layout-allow-overflow></div>

      <div id="orbit">
        <div class="piece" id="p1"></div>
        <div class="piece" id="p2"></div>
        <div class="piece" id="p3"></div>
        <div class="piece" id="p4"></div>
        <div class="piece" id="p5"></div>
        <div class="cv" id="cvSmall">
          <i class="w90"></i><i class="w70"></i><i class="w90"></i><i class="w55"></i>
        </div>
        <div id="person"></div>
      </div>

      <div id="cap">el CV es <b>una parte</b></div>
      <div class="vignette"></div>
    </div>

    <script>
      // Contenido abstracto por pieza: formas, no etiquetas. Nada se nombra.
      const SH = {
        p1: '<svg width="86" height="190" viewBox="0 0 86 190"><g fill="#b5a9cc" opacity="0.7">' +
            '<rect x="8" y="150" width="18" height="34" rx="4"/><rect x="34" y="112" width="18" height="72" rx="4"/>' +
            '<rect x="60" y="58" width="18" height="126" rx="4"/></g></svg>',
        p2: '<svg width="210" height="70" viewBox="0 0 210 70"><path d="M6 52 L46 30 L86 42 L126 16 L166 26 L204 8" ' +
            'stroke="#7b3ff2" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>',
        p3: '<svg width="112" height="112" viewBox="0 0 112 112"><circle cx="56" cy="56" r="44" ' +
            'stroke="#b5a9cc" stroke-width="9" fill="none" opacity="0.32"/><circle cx="56" cy="56" r="44" ' +
            'stroke="#7b3ff2" stroke-width="9" fill="none" stroke-linecap="round" ' +
            'stroke-dasharray="276" stroke-dashoffset="88" transform="rotate(-90 56 56)"/></svg>',
        p4: '<svg width="190" height="104" viewBox="0 0 190 104"><g stroke="#b5a9cc" stroke-width="7" ' +
            'stroke-linecap="round" opacity="0.62"><path d="M14 22 H120"/><path d="M14 52 H176"/><path d="M14 82 H86"/>' +
            '</g></svg>',
        p5: '<svg width="150" height="60" viewBox="0 0 150 60"><g fill="#b5a9cc" opacity="0.62">' +
            '<circle cx="24" cy="30" r="15"/><circle cx="64" cy="30" r="15"/><circle cx="104" cy="30" r="15"/>' +
            '</g><circle cx="104" cy="30" r="15" fill="#7b3ff2"/></svg>',
      };
      Object.keys(SH).forEach((k) => { document.getElementById(k).innerHTML = SH[k]; });

      document.getElementById("person").innerHTML =
        '<svg width="230" height="270" viewBox="0 0 100 118">' +
        '<circle cx="50" cy="22" r="19" fill="#f6f4fa"/>' +
        '<path d="M50 46 C27 46 18 62 16 100 C16 108 22 112 28 112 L72 112 C78 112 84 108 84 100 ' +
        'C82 62 73 46 50 46 Z" fill="#f6f4fa"/></svg>';

      const PIECES = ["#p5", "#p1", "#p2", "#p3", "#p4"];

      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#mesh", { y: 20 }, { y: 70, duration: 6.5, ease: "none" }, 0);

      // TOMA 8 (0 - 2.1): el CV deja de ser el protagonista — se encoge hasta ser una ficha
      tl.set("#orbit", { scale: 2.3 });
      tl.to("#orbit", { scale: 1, duration: 1.5, ease: "power3.inOut" }, 0.35);
      tl.fromTo("#cvSmall", { opacity: 1, scale: 1 },
        { scale: 0.82, duration: 1.5, ease: "power3.inOut" }, 0.35);

      // TOMA 9 (2.1 - 4.3): lo demás aparece. Cada pieza con forma propia, ninguna rotulada.
      PIECES.forEach((sel, i) => {
        tl.fromTo(sel,
          { opacity: 0, scale: 0.62, y: 30, rotate: i % 2 ? -5 : 5 },
          { opacity: 1, scale: 1, y: 0, rotate: 0, duration: 0.52,
            ease: ["back.out(1.7)", "power3.out", "expo.out", "back.out(1.4)", "power2.out"][i] },
          2.1 + i * 0.26);
      });

      // TOMA 10 (4.3 - 6.5): juntas son una persona, no un documento
      tl.to("#cvSmall", { opacity: 0.4, scale: 0.7, duration: 0.6, ease: "power2.inOut" }, 4.3);
      tl.to(PIECES, { scale: 0.86, duration: 0.8, ease: "power2.inOut", stagger: 0.03 }, 4.3);
      tl.fromTo("#person", { opacity: 0, scale: 0.7 },
        { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(1.5)" }, 4.55);
      tl.fromTo("#cap", { opacity: 0, y: 22 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 5.1);

      window.__timelines = window.__timelines || {};
      window.__timelines["s4-una-parte"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
